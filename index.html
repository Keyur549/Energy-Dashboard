function pickBackup(){const f=$('#file');f.value='';f.accept='.json,application/json';f.onchange=()=>{const x=f.files[0];f.accept='';if(!x)return;if(!/\.json$/i.test(x.name)){toast('Please choose a .json backup file','err');return}importJSON(x)};f.click()}
function cancelStaged(){S.bk=null;render()}
function restoreBackup(){const b=S.bk;if(!b){toast('Import a backup file first','err');return}const c=statsOf(DB);
  openModal({title:'Restore this backup?',danger:true,ok:'Restore backup',fn:doRestore,html:`<p>All current data (<b>${fmt(statTotal(c))}</b> items) will be <b>replaced</b> by <b>${esc(b.name)}</b> (<b>${fmt(statTotal(b.stats))}</b> items, ${esc(b.range)}).</p><label class="chk"><input type="checkbox" id="mdl_bk" checked> Download my current data as a JSON backup first (recommended)</label>`})}
function doRestore(){const b=S.bk;if(!b)return;const bk=document.getElementById('mdl_bk');if(bk&&bk.checked)exportJSON(true);const old=DB;DB=b.data;ensureStock();if(!save()){DB=old;toast('Restore failed — the backup is too large for browser storage','err');return}
  S.bk=null;S.drill='';S.eqd='';S.rep='';F=defaultF();DF={...F};toast('Backup restored');render()}
function clearAll(){const c=statsOf(DB);
  openModal({title:'Clear all data?',danger:true,ok:'Delete everything',needText:true,fn:doClear,html:`<p>This permanently deletes <b>${fmt(statTotal(c))}</b> items: ${c.plants} plants, ${c.equip} equipment, ${fmt(c.energy)} energy and ${fmt(c.diesel)} diesel records, ${fmt(c.prod)} production records, diesel stock history and monthly targets. <b>This cannot be undone.</b></p><p style="color:var(--muted)">Company profile, tariff, currency and KPI/alert limits are kept.</p><label class="chk"><input type="checkbox" id="mdl_bk" checked> Download a JSON backup first (recommended)</label><label style="display:block;margin:12px 0 5px;font-size:12.5px">Type <b>DELETE</b> to confirm</label><input id="mdl_txt" autocomplete="off" oninput="mdlCheck()" placeholder="DELETE">`})}
function doClear(){const t=document.getElementById('mdl_txt');if(!t||String(t.value).trim().toUpperCase()!=='DELETE')return;const bk=document.getElementById('mdl_bk');if(bk&&bk.checked)exportJSON(true);
  const s=DB.settings,old=DB;DB=emptyDB();DB.settings=s;if(!save()){DB=old;return}S.drill='';S.eqd='';S.rep='';S.bk=null;F=defaultF();DF={...F};toast('All data cleared');render()}
function renderBackup(){
  const c=statsOf(DB),size=JSON.stringify(DB).length,pct=Math.min(100,size/5e6*100),lb=DB.settings.lastBackup,days=lb?Math.floor((Date.now()-new Date(lb))/864e5):null,stale=days===null||days>30,b=S.bk;
  const rows=STAT_L.map(([k,l])=>`<tr><td>${l}</td><td class="n">${fmt(c[k])}</td>${b?`<td class="n">${fmt(b.stats[k])}</td><td class="n" style="color:${b.stats[k]>c[k]?'var(--green)':b.stats[k]<c[k]?'var(--red)':'var(--muted)'}">${b.stats[k]-c[k]>0?'+':''}${fmt(b.stats[k]-c[k])}</td>`:''}</tr>`).join('');
  const staged=b?`<div class="glass card" style="margin-bottom:14px;border:1px solid var(--acc)"><h3><i class="fa-solid fa-file-circle-check"></i>Backup ready to restore</h3><p style="margin-bottom:10px"><b>${esc(b.name)}</b> • ${fmt(b.size/1024,1)} KB • data v${b.ver} • ${esc(b.range)}${b.meta.exported?' • exported '+new Date(b.meta.exported).toLocaleString('en-IN'):''}${b.data.settings.company?' • '+esc(b.data.settings.company):''}</p>${b.warn.length?`<div class="alrt" style="margin-bottom:10px"><i class="fa-solid fa-circle-exclamation" style="color:var(--amber)"></i><div>${b.warn.map(esc).join('<br>')}</div></div>`:''}<div class="acts"><button class="btn red" onclick="restoreBackup()"><i class="fa-solid fa-rotate-left"></i>Restore Backup</button><button class="btn sec" onclick="cancelStaged()"><i class="fa-solid fa-xmark"></i>Discard</button></div><p style="color:var(--muted);font-size:12px;margin-top:10px">Nothing changes until you press Restore Backup and confirm. The table on the left shows current data against this file.</p></div>`:'';
  return pageTitle('Data Backup','Everything is stored in this browser — keep regular backups')+
  `<div class="grid g2" style="align-items:start"><div>
   <div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-database"></i>Current data<span class="r">${lb?'last backup '+(days===0?'today':days+' day'+(days>1?'s':'')+' ago'):'never backed up'}</span></h3>
    ${stale?`<div class="alrt" style="margin-bottom:10px"><i class="fa-solid fa-circle-exclamation" style="color:var(--amber)"></i><div>${lb?'Your last backup is over 30 days old.':'You have not downloaded a backup yet.'} Download one now.</div></div>`:''}
    <div class="tw"><table><thead><tr><th>Data</th><th class="n">Current</th>${b?'<th class="n">In backup</th><th class="n">Change</th>':''}</tr></thead><tbody>${rows}<tr style="font-weight:700"><td>Total</td><td class="n">${fmt(statTotal(c))}</td>${b?`<td class="n">${fmt(statTotal(b.stats))}</td><td class="n">${fmt(statTotal(b.stats)-statTotal(c))}</td>`:''}</tr></tbody></table></div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">Browser storage used: ${fmt(size/1024)} KB of about 5,000 KB (${pct.toFixed(1)}%)</div><div class="bar"><i style="width:${pct}%;background:${pct>80?'var(--red)':pct>60?'var(--amber)':'var(--green)'}"></i></div></div></div>
   <div>${staged}
   <div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-download"></i>Export</h3><div class="acts"><button class="btn" onclick="exportJSON()"><i class="fa-solid fa-file-code"></i>Download JSON Backup</button><button class="btn grn" onclick="exportAllXLSX()"><i class="fa-solid fa-file-excel"></i>Export All Data (Excel)</button></div><p style="color:var(--muted);margin-top:10px;font-size:12.5px">The JSON backup contains everything (data, targets, stock, settings) and can be restored here. The Excel export puts each table on its own sheet for reading or analysis — it cannot be restored.</p></div>
   <div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-upload"></i>Import &amp; Restore</h3><div class="acts"><button class="btn sec" onclick="pickBackup()"><i class="fa-solid fa-file-import"></i>Import Backup</button><button class="btn red" onclick="restoreBackup()" ${b?'':'disabled'}><i class="fa-solid fa-rotate-left"></i>Restore Backup</button></div><p style="color:var(--muted);margin-top:10px;font-size:12.5px"><b>Step 1</b> Import Backup — choose a .json backup; it is checked and previewed, nothing is changed. <b>Step 2</b> Restore Backup — replaces current data after you confirm.</p></div>
   <div class="glass card" style="border:1px solid rgba(248,113,113,.4)"><h3 style="color:var(--red)"><i class="fa-solid fa-triangle-exclamation"></i>Danger zone</h3><div class="acts"><button class="btn red" onclick="clearAll()"><i class="fa-solid fa-trash"></i>Clear All Data</button>${DB.sample?'<button class="btn amb" onclick="deleteSample()" title="Remove the sample plants, equipment and records"><i class="fa-solid fa-flask"></i>Delete sample data</button>':''}<button class="btn sec" onclick="loadDemo()" title="Replace everything with fresh sample data"><i class="fa-solid fa-wand-magic-sparkles"></i>Load sample data</button></div><p style="color:var(--muted);margin-top:10px;font-size:12.5px">Clearing asks for confirmation (you must type DELETE) and offers to download a backup first.</p></div></div></div>`}

/* ============ UX helpers: confirmation dialog, tooltips, sample banner ============ */
const ask=(title,html,ok,fn,danger=true)=>openModal({title,html:`<p>${html}</p>`,ok,fn,danger});
const q$=s=>encodeURIComponent(String(s)).replace(/'/g,'%27');
const TIPMAP={'fa-pen':'Edit','fa-pen-to-square':'Edit','fa-trash':'Delete','fa-copy':'Duplicate','fa-clone':'Duplicate','fa-xmark':'Close','fa-eye':'Preview','fa-file-excel':'Export to Excel','fa-file-pdf':'Export to PDF','fa-print':'Print','fa-plus':'Add','fa-arrow-left':'Go back','fa-rotate-left':'Reset','fa-floppy-disk':'Save','fa-download':'Download','fa-upload':'Upload','fa-chevron-left':'Previous','fa-chevron-right':'Next'};
function addTips(){try{document.querySelectorAll('#view button').forEach(b=>{if(b.title||(b.textContent||'').trim())return;const i=b.querySelector('i');if(!i)return;const c=[...i.classList].find(x=>TIPMAP[x]);if(c)b.title=TIPMAP[c]})}catch(e){}}
const KTIP={'Total Energy Consumption':'Electrical energy used in the selected period (kWh)','Total Diesel Consumption':'Diesel burnt in the selected period (litres)','Total Energy Cost':'Electricity cost + diesel cost','SEC':'Specific Energy Consumption = kWh ÷ production','Diesel Specific Consumption':'Diesel litres ÷ production','Overall Energy Efficiency':'Target SEC ÷ actual SEC (100% = on target)','Total Production':'Production recorded in the period'};
function sampleCounts(){const c=k=>(DB[k]||[]).filter(x=>x.s).length;return{plants:c('plants'),equip:c('equip'),records:c('energy')+c('diesel')+c('prod')+c('dieselRecv')+c('dieselAdj')+c('dieselDips')}}
function sampleBanner(){if(!DB.sample||S.hideSample||S.view==='entry')return'';const c=sampleCounts();
  return`<div class="sbn"><i class="fa-solid fa-flask"></i><div><b>You are looking at sample data</b> — ${c.plants} plants, ${c.equip} equipment, ${fmt(c.records)} records. Try everything out, add your own data, then remove the samples when you are ready.</div><div class="acts"><button class="btn sm red" onclick="deleteSample()"><i class="fa-solid fa-trash"></i>Delete sample data</button><button class="btn sm sec" onclick="S.hideSample=true;render()" title="Hide this message for now"><i class="fa-solid fa-xmark"></i></button></div></div>`}
function deleteSample(){if(!DB.sample){toast('There is no sample data to delete','info');return}const c=sampleCounts();
  ask('Delete sample data?',`This removes the sample <b>${c.plants}</b> plants, <b>${c.equip}</b> equipment and <b>${fmt(c.records)}</b> records, plus sample rates, targets and diesel stock. <b>Anything you added yourself is kept</b> (a sample plant or equipment is kept if you have booked your own records on it).`,'Delete sample data',doDeleteSample)}
function doDeleteSample(){
  ['energy','diesel','prod','dieselRecv','dieselAdj','dieselDips','bills'].forEach(k=>DB[k]=(DB[k]||[]).filter(x=>!x.s));
  const used=new Set([...DB.energy,...DB.diesel].map(x=>x.equip));DB.equip=DB.equip.filter(e=>!e.s||used.has(e.id));
  const usedP=new Set([...DB.equip.map(e=>e.plant),...DB.energy.map(x=>x.plant),...DB.diesel.map(x=>x.plant),...DB.prod.map(x=>x.plant)]);
  const gone=DB.plants.filter(p=>p.s&&!usedP.has(p.id)).map(p=>p.id);DB.plants=DB.plants.filter(p=>!gone.includes(p.id));
  Object.keys(DB.mtargets||{}).forEach(k=>{if(gone.includes(k.split('|')[0]))delete DB.mtargets[k]});
  if(DB.rates){DB.rates.e=DB.rates.e.filter(x=>!x.s);DB.rates.d=DB.rates.d.filter(x=>!x.s)}
  if(DB.stock&&DB.stock.s)DB.stock={opening:0,date:'',reorder:0,capacity:0};
  [DB.plants,DB.equip].forEach(a=>a.forEach(x=>{delete x.s}));DB.sample=false;
  S.drill='';S.eqd='';S.rep='';S.eqEdit='';F=defaultF();DF={...F};save();toast('Sample data deleted — you can now add your own data');S.view=DB.plants.length?S.view:'master';render()}
function loadDemo(){ask('Load sample data?','All current data will be <b>replaced</b> by fresh sample data (3 plants, 16 equipment, 90 days of readings). Download a backup first if you need your current data.','Load sample data',()=>{DB=seedDB();F=defaultF();DF={...F};S.hideSample=false;S.drill='';S.eqd='';S.rep='';save();toast('Sample data loaded');render()},true)}
function toastIcon(){}

/* ============ MASTER DATA ============ */
const BASE_ET_LIST=BASE_ET;
const EQ_STATUS=['Active','Standby','Under Maintenance','Decommissioned'];
const METER_TYPES=['Digital Energy Meter','Smart Meter (AMR/AMI)','Analog Energy Meter','CT-Operated Meter','Fuel Flow Meter','Tank Dip / Level','No Meter'];
const eqStChip=s=>`<span class="chip ${{Active:'g',Standby:'b','Under Maintenance':'a',Decommissioned:'x'}[s||'Active']||'x'}">${esc(s||'Active')}</span>`;
function ensureMaster(){DB.ptot=DB.ptot||[];DB.bills=DB.bills||[];DB.mreads=DB.mreads||[];DB.areas=DB.areas||[];DB.etypes=DB.etypes||[];DB.rates=DB.rates||{e:[],d:[]};DB.rates.e=DB.rates.e||[];DB.rates.d=DB.rates.d||[];
  const want=[...BASE_ET,...DB.etypes.filter(t=>!BASE_ET.includes(t))];if(ETYPES.join('|')!==want.join('|')){ETYPES.length=0;ETYPES.push(...want)}
  [['e','tariff'],['d','dieselRate']].forEach(([k,s])=>{const L=DB.rates[k];if(L.length){const h=rateEntry(k,today());if(h)DB.settings[s]=h.rate}})}
function rateEntry(k,date){const L=(DB.rates&&DB.rates[k])||[];if(!L.length)return null;let best=null,first=L[0];L.forEach(x=>{if(x.from<first.from)first=x;if(x.from<=date&&(!best||x.from>best.from))best=x});return best||first}
function rateOn(k,date){const h=rateEntry(k,date||today());return h?h.rate:(k==='e'?DB.settings.tariff:DB.settings.dieselRate)}
const allAreas=()=>uniq([...DB.equip.map(e=>e.area||'General'),...(DB.areas||[])]);
const MT=[['plants','fa-industry','Plants'],['areas','fa-location-dot','Areas'],['equip','fa-microchip','Equipment'],['types','fa-shapes','Equipment Types'],['erate','fa-bolt','Energy Rates'],['drate','fa-gas-pump','Diesel Rates'],['prod','fa-boxes-stacked','Production Units'],['targets','fa-bullseye','Targets']];
function mtab(k){S.mt=k;S.mpEdit='';S.maEdit='';S.metEdit='';S.rEdit=null;render();window.scrollTo(0,0)}
function renderMaster(){
  const t=MT.some(x=>x[0]===S.mt)?S.mt:'plants';S.mt=t;
  const body={plants:mPlants,areas:mAreas,equip:mEquip,types:mTypes,erate:()=>mRates('e'),drate:()=>mRates('d'),prod:mProd,targets:mTargets}[t]();
  return pageTitle('Master Data','Set up plants, areas, equipment, rates, units and targets — changes apply across the whole dashboard')+
  `<div class="mtabs">${MT.map(([k,i,l])=>`<button class="btn sm ${k===t?'':'sec'}" onclick="mtab('${k}')" title="Manage ${l.toLowerCase()}"><i class="fa-solid ${i}"></i>${l}</button>`).join('')}</div>${body}`}
/* ---- plants ---- */
function mPlants(){const ed=S.mpEdit?DB.plants.find(p=>p.id===S.mpEdit):null;
  const rows=DB.plants.map(p=>{const ne=DB.equip.filter(e=>e.plant===p.id).length,nr=DB.energy.filter(x=>x.plant===p.id).length+DB.diesel.filter(x=>x.plant===p.id).length;
    return`<tr><td><b>${esc(p.name)}</b>${p.s?' <span class="chip x" title="Part of the sample data">Sample</span>':''}</td><td class="n">${ne}</td><td class="n">${fmt(nr)}</td><td style="white-space:nowrap"><button class="btn sec sm" onclick="S.mpEdit='${p.id}';render()" title="Edit plant"><i class="fa-solid fa-pen"></i></button> <button class="btn sec sm" onclick="delPlant('${p.id}')" title="Delete plant"><i class="fa-solid fa-trash"></i></button></td></tr>`}).join('');
  return`<div class="grid g2" style="align-items:start"><div class="glass card"><h3><i class="fa-solid fa-${ed?'pen':'plus'}"></i>${ed?'Edit Plant':'Add Plant'}</h3><form class="form" style="grid-template-columns:1fr" onsubmit="savePlantM(event)"><div><label>Plant name</label><input name="name" required maxlength="60" value="${esc(ed?ed.name:'')}" placeholder="e.g. Plant D"></div><div class="fact" style="margin:0"><button class="btn grn"><i class="fa-solid fa-floppy-disk"></i>${ed?'Update':'Save'}</button>${ed?'<button type="button" class="btn sec" onclick="S.mpEdit=\'\';render()">Cancel</button>':''}</div></form><p style="color:var(--muted);font-size:12px;margin-top:10px">Targets for each plant are set in the <a class="lnk" onclick="mtab('targets')">Targets</a> tab.</p></div>
  <div class="glass card"><h3><i class="fa-solid fa-industry"></i>Plants<span class="r">${DB.plants.length}</span></h3><div class="tw"><table><thead><tr><th>Plant</th><th class="n">Equipment</th><th class="n">Records</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=4 class="empty">No plants yet — add your first plant</td></tr>'}</tbody></table></div></div></div>`}
function savePlantM(ev){ev.preventDefault();const n=ev.target.elements.name.value.trim();if(!n){toast('Enter a plant name','err');return}
  if(DB.plants.some(p=>p.name.toLowerCase()===n.toLowerCase()&&p.id!==S.mpEdit)){toast('A plant with this name already exists','err');return}
  if(S.mpEdit){const p=DB.plants.find(x=>x.id===S.mpEdit);if(p)p.name=n;S.mpEdit='';toast('Plant updated')}else{DB.plants.push({id:uid(),name:n,base:0,tKWh:0,tDiesel:0,tSEC:0});toast('Plant added')}save();render()}
function delPlant(id){const p=plMap()[id];if(!p)return;const ne=DB.equip.filter(e=>e.plant===id).length,nr=DB.energy.filter(x=>x.plant===id).length+DB.diesel.filter(x=>x.plant===id).length+DB.prod.filter(x=>x.plant===id).length;
  ask('Delete plant?',`<b>${esc(p.name)}</b> will be deleted together with its <b>${ne}</b> equipment and <b>${fmt(nr)}</b> records. This cannot be undone.`,'Delete plant',()=>{DB.plants=DB.plants.filter(x=>x.id!==id);DB.equip=DB.equip.filter(e=>e.plant!==id);['energy','diesel','prod'].forEach(k=>DB[k]=DB[k].filter(x=>x.plant!==id));Object.keys(DB.mtargets||{}).forEach(k=>{if(k.split('|')[0]===id)delete DB.mtargets[k]});if(F.plant===id){F.plant='';DF={...F}}S.drill='';S.mpEdit='';save();toast('Plant deleted');render()})}
/* ---- areas ---- */
function mAreas(){const ed=S.maEdit,A=allAreas();
  const rows=A.map(a=>{const n=DB.equip.filter(e=>(e.area||'General')===a).length,lock=a==='General';return`<tr><td><b>${esc(a)}</b></td><td class="n">${n}</td><td style="white-space:nowrap">${lock?'<span class="chip x" title="Default area">Default</span>':`<button class="btn sec sm" onclick="S.maEdit=decodeURIComponent('${q$(a)}');render()" title="Rename area"><i class="fa-solid fa-pen"></i></button> <button class="btn sec sm" onclick="delArea(decodeURIComponent('${q$(a)}'))" title="Delete area"><i class="fa-solid fa-trash"></i></button>`}</td></tr>`}).join('');
  return`<div class="grid g2" style="align-items:start"><div class="glass card"><h3><i class="fa-solid fa-${ed?'pen':'plus'}"></i>${ed?'Rename Area':'Add Area'}</h3><form class="form" style="grid-template-columns:1fr" onsubmit="saveArea(event)"><div><label>Area name</label><input name="name" required maxlength="40" value="${esc(ed||'')}" placeholder="e.g. Compressor House"></div><div class="fact" style="margin:0"><button class="btn grn"><i class="fa-solid fa-floppy-disk"></i>${ed?'Update':'Save'}</button>${ed?'<button type="button" class="btn sec" onclick="S.maEdit=\'\';render()">Cancel</button>':''}</div></form><p style="color:var(--muted);font-size:12px;margin-top:10px">Areas group equipment inside a plant (e.g. Compressor House, DG Yard). Renaming an area updates every equipment using it.</p></div>
  <div class="glass card"><h3><i class="fa-solid fa-location-dot"></i>Areas<span class="r">${A.length}</span></h3><div class="tw"><table><thead><tr><th>Area</th><th class="n">Equipment</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=3 class="empty">No areas yet</td></tr>'}</tbody></table></div></div></div>`}
function saveArea(ev){ev.preventDefault();const n=ev.target.elements.name.value.trim(),old=S.maEdit;if(!n){toast('Enter an area name','err');return}
  if(allAreas().some(a=>a.toLowerCase()===n.toLowerCase()&&a!==old)){toast('This area already exists','err');return}
  if(old){DB.equip.forEach(e=>{if((e.area||'General')===old)e.area=n});DB.areas=DB.areas.map(a=>a===old?n:a);if(!DB.areas.includes(n)&&DB.equip.every(e=>e.area!==n))DB.areas.push(n);S.maEdit='';toast('Area renamed')}else{DB.areas.push(n);toast('Area added')}save();render()}
function delArea(a){const n=DB.equip.filter(e=>(e.area||'General')===a).length;if(n){toast(`"${a}" is used by ${n} equipment — move them to another area first`,'warn');return}
  ask('Delete area?',`Delete the area <b>${esc(a)}</b>?`,'Delete area',()=>{DB.areas=DB.areas.filter(x=>x!==a);save();toast('Area deleted');render()})}
/* ---- equipment ---- */
function eqFormCard(){const edit=S.eqEdit?EQM[S.eqEdit]:null,o=edit||{code:nextCode(),name:'',plant:DB.plants[0]?.id||'',area:'',etype:'Motor',kw:'',capUnit:'kW',type:'electrical',ratedVoltage:'',ratedCurrent:'',manufacturer:'',commissioned:'',meterType:'Digital Energy Meter',status:'Active',remarks:''},opt=(arr,sel)=>arr.map(t=>`<option ${t===sel?'selected':''}>${esc(t)}</option>`).join('');
  return`<div class="glass card" id="eqForm" style="margin-bottom:14px"><h3><i class="fa-solid fa-${edit?'pen':'plus'}"></i>${edit?'Edit Equipment':'Add Equipment'}</h3>
   <form class="form" onsubmit="saveEquip(event)">

    <div><label>Energy source</label><select name="type"><option value="electrical" ${o.type==='electrical'?'selected':''}>Electrical (kWh)</option><option value="diesel" ${o.type==='diesel'?'selected':''}>Diesel (litres)</option></select></div>
    <div><label>Rated voltage (V)</label><input type="number" name="ratedVoltage" min="0" step="any" value="${o.ratedVoltage??''}" inputmode="decimal" placeholder="e.g. 415"></div>
    <div><label>Rated current (A)</label><input type="number" name="ratedCurrent" min="0" step="any" value="${o.ratedCurrent??''}" inputmode="decimal" placeholder="e.g. 350"></div>
    <div><label>Manufacturer</label><input name="manufacturer" value="${esc(o.manufacturer||'')}" maxlength="60"></div>
    <div><label>Commissioning date</label><input type="date" name="commissioned" value="${esc(o.commissioned||'')}" max="${today()}"></div>

/* ============ SECTION 21: CALCULATION ENGINE (every formula in one place, zero-safe) ============ */
const dieselCV=()=>+DB.settings.dieselCV>0?+DB.settings.dieselCV:10;
const CALC={
  num:v=>v===''||v===null||v===undefined||isNaN(+v)?null:+v,
  div:(a,b)=>{a=CALC.num(a);b=CALC.num(b);return a!==null&&b!==null&&b!==0&&isFinite(a/b)?a/b:null},          /* all divisions go through here: x/0 -> null, shown as a dash */
  energy:(ms,me)=>{ms=CALC.num(ms);me=CALC.num(me);return ms===null||me===null?null:me-ms},                      /* Energy Consumption = Meter End - Meter Start */
  diesel:(ds,de)=>{ds=CALC.num(ds);de=CALC.num(de);return ds===null||de===null?null:de-ds},                      /* Diesel Consumption = Diesel End - Diesel Start */
  cost:(q,rate)=>{q=CALC.num(q);rate=CALC.num(rate);return q===null||rate===null?null:q*rate},                  /* Cost = Consumption x Rate */
  sec:(energy,prod)=>CALC.div(energy,prod),                                                                      /* SEC = Energy / Production */
  dsc:(diesel,prod)=>CALC.div(diesel,prod),                                                                      /* Diesel Specific Consumption = Diesel / Production */
  dgRate:(diesel,hours)=>CALC.div(diesel,hours),                                                                 /* DG Diesel Rate = Diesel / Running Hours (L/h) */
  dgSfc:(diesel,kwhGen)=>CALC.div(diesel,kwhGen),                                                                /* DG Specific Fuel Consumption = Diesel / kWh generated (L/kWh) */
  variance:(actual,target)=>{actual=CALC.num(actual);target=CALC.num(target);return actual===null||target===null?null:actual-target},        /* Variance = Actual - Target */
  variancePct:(actual,target)=>{const v=CALC.variance(actual,target),t=CALC.num(target);return v===null||!t?null:v/t*100},                    /* Variance % = (Actual - Target) / Target x 100 */

  dgEfficiency:(kwhGen,litres)=>CALC.efficiency(kwhGen,CALC.num(litres)===null?null:litres*dieselCV())            /* DG thermal efficiency: kWh generated / (litres x calorific value) */

 {k:'var',n:'Variance',f:'Actual − Target',u:''},

    ['sec','SEC',CALC.sec(kP,pP),a.secP?a.sec:null,'kWh/'+pu().p],['dsc','Diesel Specific Consumption',CALC.dsc(lP,pP),a.secP?a.dsc:null,'L/'+pu().p],

   <div class="form" id="calcF" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['ms','Meter start'],['me','Meter end'],['er','Energy rate ('+cur()+'/kWh)'],['ds','Diesel start (L)'],['de','Diesel end (L)'],['dr','Diesel rate ('+cur()+'/L)'],['pr','Production ('+pu().n+')'],['hr','Running hours'],['gk','kWh generated'],['ac','Actual'],['tg','Target'],['ou','Useful output'],['ip','Energy input']].map(([k,l])=>`<div><label>${l}</label><input type="number" step="any" id="c_${k}" inputmode="decimal" oninput="calcLive()"></div>`).join('')}</div></div>
  <div class="glass card"><h3><i class="fa-solid fa-equals"></i>Results</h3><div class="tw"><table><tbody id="calcR"></tbody></table></div></div></div>`}
function calcLive(){const v=k=>{const e=document.getElementById('c_'+k);return e?CALC.num(e.value):null},U=pu().p,C=cur();

function waDefaultDate(){const t=today();if(DB.energy.some(x=>x.date===t))return t;const d=DB.energy.reduce((m,x)=>x.date>m?x.date:m,'');return d||t}
function waText(d){
  const a=withF({},()=>agg({f:d,to:d})),rows=withF({},()=>plantRows(a)),P=pu(),s=DB.settings,L=[];
  const dt=new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const tg=a.partial?0:a.tPeriod,vp=tg?CALC.variancePct(a.kwh,tg):null,sg=v=>(v>0?'+':'')+v.toFixed(1)+'%';
  L.push('*'+s.company+'*','⚡ Daily Energy Report – '+dt,'');

  L.push('*Diesel:* '+fmt(a.litres,1)+' L ('+money(a.dcost)+')');
  if(a.prodTot)L.push('*Production:* '+fmt(a.prodTot,1)+' '+P.n+' | SEC '+fmt(a.sec,1)+' '+secU());
  L.push('*Cost:* '+money(a.ecost+a.dcost)+' (electricity '+money(a.ecost)+')');
  const pr=rows.filter(x=>x.kwh>0||x.l>0);
  if(pr.length>1){L.push('','*Plant-wise*');pr.forEach(x=>L.push('• '+x.name+': '+fmt(x.kwh)+' kWh'+(x.vr!==null?' ('+sg(x.vr)+')':'')+(x.l?', diesel '+fmt(x.l,1)+' L':'')+(x.sec?', SEC '+fmt(x.sec,1):'')))}
  try{const sl=stockLedger(d,d);if(sl&&sl.rows.length){const c=sl.rows[0].close,ro=+DB.stock.reorder||0;L.push('','*Diesel stock:* '+fmt(c)+' L'+(ro&&c<=ro?' ⚠ below reorder level':''))}}catch(e){}
  try{const al=withF({},()=>computeAlerts(d,d,false)).sort((x,y)=>(x.sev==='critical'?0:1)-(y.sev==='critical'?0:1));
    if(al.length){L.push('','⚠ *'+al.length+' abnormal'+(al.length>1?'ities':'ity')+'*');al.slice(0,3).forEach(x=>L.push('• '+[x.plant,x.equip].filter(v=>v&&v!=='—').join(' / ')+': '+String(x.msg).replace(/\s+/g,' ')));if(al.length>3)L.push('• …and '+(al.length-3)+' more')}else L.push('','✅ No abnormalities')}catch(e){}
  if(!a.E.length&&!a.D.length)L.push('','No readings recorded for this date.');
  L.push('','Reported by '+(Cloud.auth&&Cloud.auth.name||s.user)+((Cloud.auth&&Cloud.auth.role||s.role)?' ('+(Cloud.auth&&Cloud.auth.role||s.role)+')':''));return L.join('\n')}

/* ============ electricity bill vs meter ============ */
const BILL_TOL={ok:2,bad:5};
function billMeter(mo,plant){const[y,m]=mo.split('-').map(Number),last=new Date(y,m,0).getDate();return withF(plant?{plant}:{},()=>agg({f:mo+'-01',to:mo+'-'+String(last).padStart(2,'0')}).kwh)}
function billRow(b){const meter=billMeter(b.month,b.plant),diff=b.units-meter,pct=CALC.div(diff,meter)===null?null:diff/meter*100,ap=pct===null?null:Math.abs(pct);
  const st=ap===null?['No meter data','n']:ap<=BILL_TOL.ok?['Matches','g']:ap<=BILL_TOL.bad?['Check','a']:['Mismatch','r'];
  const fl=[];if(b.cd&&b.md>b.cd)fl.push(['MD above contract demand','r']);if(b.pf&&b.pf<0.9)fl.push(['Low power factor','r']);else if(b.pf&&b.pf<0.95)fl.push(['PF below 0.95','a']);
  return{b,meter,diff,pct,st,fl,rate:CALC.div(b.amount,b.units),mdu:b.cd?CALC.div(b.md,b.cd)*100:null}}
function billsSorted(){return[...(DB.bills||[])].sort((x,y)=>y.month.localeCompare(x.month)||String(x.plant).localeCompare(String(y.plant)))}
function renderBills(){
  if(!DB.plants.length)return pageTitle('Electricity Bill','')+noPlants();
  DB.bills=DB.bills||[];const PL=plMap(),e=DB.bills.find(x=>x.id===S.billEdit)||{},rows=billsSorted().map(billRow),pn=id=>id?PL[id]?.name||'—':'All plants';
  const n=rows.length,avgD=n?rows.filter(r=>r.pct!==null).reduce((s,r)=>s+Math.abs(r.pct),0)/(rows.filter(r=>r.pct!==null).length||1):0,tot=rows.reduce((s,r)=>s+(+r.b.amount||0),0),un=rows.reduce((s,r)=>s+(+r.b.units||0),0),pfs=rows.filter(r=>r.b.pf);
  const field=(l,nm,v,ex='')=>`<div><label>${l}</label><input name="${nm}" type="number" step="any" min="0" inputmode="decimal" value="${v===undefined||v===null?'':esc(v)}" ${ex}></div>`;
  const kp=n?`<div class="kpis sm" style="margin-bottom:14px">${kpi('fa-file-invoice','Bills entered',n,0,'','var(--cyan)','')}${kpi('fa-scale-unbalanced','Avg. meter mismatch',avgD,1,'%',avgD>BILL_TOL.bad?'var(--red)':avgD>BILL_TOL.ok?'var(--amber)':'var(--green)','')}${kpi('fa-indian-rupee-sign','Total billed',tot,0,'','var(--violet)','',cur()+' ')}${kpi('fa-gauge','Avg. cost per unit',un?tot/un:0,2,cur()+'/kWh','#fb923c','')}</div>`:'';
  const trs=rows.map(r=>`<tr><td><b>${esc(r.b.month)}</b></td><td>${esc(pn(r.b.plant))}</td><td class="n">${fmt(r.meter)}</td><td class="n">${fmt(r.b.units)}</td><td class="n">${r.meter?(r.diff>0?'+':'')+fmt(r.diff):'—'}</td><td class="n">${r.pct===null?'—':(r.pct>0?'+':'')+r.pct.toFixed(1)+'%'}</td><td><span class="chip ${r.st[1]}">${r.st[0]}</span></td><td class="n">${r.b.amount?money(r.b.amount):'—'}</td><td class="n">${r.rate===null?'—':fmt(r.rate,2)}</td><td class="n">${r.b.md?fmt(r.b.md,0)+(r.mdu===null?'':' ('+r.mdu.toFixed(0)+'%)'):'—'}</td><td class="n">${r.b.pf?(+r.b.pf).toFixed(3):'—'}</td><td class="n">${r.b.pfAdj?(r.b.pfAdj>0?'+':'')+fmt(r.b.pfAdj):'—'}</td><td>${r.fl.map(f=>`<span class="chip ${f[1]}">${f[0]}</span>`).join(' ')||'—'}</td><td class="n"><button class="btn sm sec" onclick="billEdit('${r.b.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button> <button class="btn sm red" onclick="billDel('${r.b.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');
  setTimeout(billChart,0);
  return pageTitle('Electricity Bill vs Meter',`Compare the DISCOM bill with your own meter readings • match within ${BILL_TOL.ok}%, check up to ${BILL_TOL.bad}%`,DB.sample&&!rows.some(r=>r.b.s)?`<button class="btn sec" onclick="billSample()"><i class="fa-solid fa-flask"></i><span class="hide-m">Add sample bills</span></button>`:'')+kp+
  `<div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-${e.id?'pen-to-square':'circle-plus'}"></i>${e.id?'Edit bill':'Add monthly bill'}${e.id?'<span class="r"><span class="chip a">Edit mode</span></span>':''}</h3><form class="form" onsubmit="saveBill(event)">
   <div><label>Bill month *</label><input name="month" type="month" required value="${esc(e.month||'')}" max="${today().slice(0,7)}"></div>
   <div><label>Plant / meter point</label><select name="plant"><option value="">All plants (main incomer)</option>${DB.plants.map(p=>`<option value="${p.id}" ${e.plant===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
   ${field('Billed units (kWh) *','units',e.units,'required')}${field('Total bill amount ('+cur()+')','amount',e.amount)}
   ${field('Maximum demand recorded (kVA)','md',e.md)}${field('Contract demand (kVA)','cd',e.cd)}
   ${field('Average power factor (0.5 – 1)','pf',e.pf,'max="1"')}
   <div><label>PF incentive (+) / penalty (−) (${cur()})</label><input name="pfAdj" type="number" step="any" inputmode="decimal" value="${e.pfAdj===undefined?'':esc(e.pfAdj)}"></div>
   <div style="grid-column:1/-1"><label>Remarks</label><input name="remarks" maxlength="200" value="${esc(e.remarks||'')}"></div>
   <div class="acts" style="grid-column:1/-1"><button class="btn grn"><i class="fa-solid fa-floppy-disk"></i>${e.id?'Save changes':'Save bill'}</button>${e.id?'<button type="button" class="btn sec" onclick="billCancel()">Cancel</button>':''}</div></form></div>`+
  (n?`<div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-chart-column"></i>Billed vs metered units<span class="r">kWh</span></h3><div class="cbox s"><canvas id="bB"></canvas></div></div>
  <div class="glass card"><h3><i class="fa-solid fa-table"></i>Reconciliation<span class="r"><button class="btn sm sec" onclick="billExport()"><i class="fa-solid fa-file-csv"></i>CSV</button></span></h3><div class="tw"><table><thead><tr><th>Month</th><th>Plant</th><th class="n">Meter kWh</th><th class="n">Billed kWh</th><th class="n">Difference</th><th class="n">Diff %</th><th>Status</th><th class="n">Bill</th><th class="n">${cur()}/kWh</th><th class="n">Max demand kVA (of contract)</th><th class="n">PF</th><th class="n">PF adj.</th><th>Flags</th><th></th></tr></thead><tbody>${trs}</tbody></table></div><p style="color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5">Meter kWh is the total of all energy readings entered in this app for that month (and plant). If you enter both main-incomer and sub-meter readings, pick the plant or keep only incomer readings so units are not counted twice. PF incentive / penalty rules differ by DISCOM — enter the amount shown on your bill.</p></div>`:`<div class="glass empty"><i class="fa-solid fa-file-invoice"></i>No bills yet. Add your first monthly bill above to compare it with the meter readings.</div>`)}
function billChart(){if(typeof Chart==='undefined')return;const rows=billsSorted().map(billRow).reverse().slice(-12);if(!rows.length)return;chartBase();
  mk('bB',{type:'bar',data:{labels:rows.map(r=>r.b.month+(r.b.plant?' · '+(plMap()[r.b.plant]?.name||''):'')),datasets:[{label:'Metered (app)',data:rows.map(r=>Math.round(r.meter)),backgroundColor:'rgba(34,211,238,.75)',borderRadius:5},{label:'Billed (DISCOM)',data:rows.map(r=>Math.round(r.b.units)),backgroundColor:'rgba(167,139,250,.8)',borderRadius:5}]},options:{interaction:{mode:'index',intersect:false},scales:{x:gridless,y:{beginAtZero:true}},plugins:{legend:{position:'bottom'},tooltip:{callbacks:{afterBody:it=>{const r=rows[it[0].dataIndex];return r.pct===null?'':'Difference: '+(r.pct>0?'+':'')+r.pct.toFixed(1)+'%'}}}}}})}
function saveBill(ev){ev.preventDefault();const f=ev.target.elements,v=k=>f[k].value.trim()===''?null:Number(f[k].value),month=f.month.value,plant=f.plant.value,units=v('units');
  if(!/^\d{4}-\d{2}$/.test(month)){toast('Choose the bill month','err');return}
  if(!(units>0)){toast('Enter the billed units (kWh)','err');return}
  const pf=v('pf');if(pf!==null&&!(pf>=0.5&&pf<=1)){toast('Power factor must be between 0.5 and 1','err');return}
  for(const k of['amount','md','cd']){const x=v(k);if(x!==null&&x<0){toast('Values cannot be negative','err');return}}
  DB.bills=DB.bills||[];if(DB.bills.some(x=>x.month===month&&x.plant===plant&&x.id!==S.billEdit)){toast('A bill for this month and plant already exists — edit it instead','err');return}
  const rec={month,plant,units,amount:v('amount')||0,md:v('md')||0,cd:v('cd')||0,pf:pf||0,pfAdj:v('pfAdj')||0,remarks:f.remarks.value.trim()};

function billExport(){const PL=plMap();dl(csvBlob([['Month','Plant','Meter kWh','Billed kWh','Difference kWh','Difference %','Status','Bill amount','Rate per kWh','Max demand kVA','Contract demand kVA','Power factor','PF incentive/penalty','Flags','Remarks'],...billsSorted().map(billRow).map(r=>[r.b.month,r.b.plant?PL[r.b.plant]?.name||'':'All plants',Math.round(r.meter),r.b.units,Math.round(r.diff),r.pct===null?'':+r.pct.toFixed(2),r.st[0],r.b.amount,r.rate===null?'':+r.rate.toFixed(2),r.b.md,r.b.cd,r.b.pf,r.b.pfAdj,r.fl.map(f=>f[0]).join('; '),r.b.remarks||''])]),'Electricity_Bill_Check.csv');toast('CSV exported')}

{ic:'fa-rocket',rg:'App shari rite shuru karvi',gu:'એપ શરૂ કેવી રીતે કરવી',
 rs:['App ni link Chrome ma kholo. Pehli vaar sample data dekhase, jethi tame badhu try kari shako.','Settings ma jai ne company nu naam, jagya, tamaru naam ane role lakhi Save karo.','Tamaro potano data nakhvo hoy tyare Settings ma "Delete sample data" dabavo. Tamaro potano data surakshit rahese.','Phone ma Chrome na menu mathi "Add to Home screen" karo, jethi app icon thi khule.'],
 gs:['એપની લિંક ક્રોમમાં ખોલો. પહેલી વાર સેમ્પલ ડેટા દેખાશે, જેથી તમે બધું અજમાવી શકો.','સેટિંગ્સમાં જઈને કંપનીનું નામ, જગ્યા, તમારું નામ અને હોદ્દો લખીને સેવ કરો.','તમારે તમારો પોતાનો ડેટા નાખવો હોય ત્યારે સેટિંગ્સમાં "ડિલીટ સેમ્પલ ડેટા" દબાવો. તમારો પોતાનો ડેટા સુરક્ષિત રહેશે.','ફોનમાં ક્રોમના મેનુમાંથી "હોમ સ્ક્રીન પર ઉમેરો" કરો, જેથી એપ આઇકનથી ખુલે.']},
{ic:'fa-database',rg:'Pehla Master Data bharo',gu:'પહેલા માસ્ટર ડેટા ભરો',
 rs:['Menu ma "Master Data" kholo. Pehla Plants add karo: plant nu naam, roj no energy target ane diesel target.','Pachhi Areas ane Equipment add karo: equipment nu naam, ID, plant, area, type, capacity ane status.','Energy rate (rupiya per kWh) ane Diesel rate (rupiya per litre) tarikh sathe add karo. Rate badlay tyare navi tarikh sathe navo rate add karo; juna records potana juna rate par j rahe chhe.','Production unit, Tonnes ke Units, pasand karo.'],
 gs:['મેનુમાંથી "માસ્ટર ડેટા" ખોલો. પહેલા પ્લાન્ટ ઉમેરો: પ્લાન્ટનું નામ, રોજનો એનર્જી ટાર્ગેટ અને ડીઝલ ટાર્ગેટ.','પછી એરિયા અને ઇક્વિપમેન્ટ ઉમેરો: ઇક્વિપમેન્ટનું નામ, આઈડી, પ્લાન્ટ, એરિયા, પ્રકાર, ક્ષમતા અને સ્ટેટસ.','એનર્જી રેટ, રૂપિયા પ્રતિ કિલોવોટ કલાક, અને ડીઝલ રેટ, રૂપિયા પ્રતિ લિટર, તારીખ સાથે ઉમેરો. રેટ બદલાય ત્યારે નવી તારીખ સાથે નવો રેટ ઉમેરો; જૂના રેકોર્ડ તેમના જૂના રેટ પર જ રહે છે.','પ્રોડક્શન યુનિટ, ટન કે યુનિટ, પસંદ કરો.']},
{ic:'fa-pen-to-square',rg:'Roj no data entry',gu:'રોજની ડેટા એન્ટ્રી',
 rs:['Menu ma "Data Entry" kholo. Tarikh, plant ane equipment pasand karo. Data 24 kalak pachhi levatu hoy to Settings ma "Data entry mode" Daily rakho, to shift puchhse nahi. Pachhi shift-wise data levo to Shift-wise karo.','Meter start ane meter end lakho. Energy kWh potani jate thai jase, etle meter end minus meter start. Meter end, start thi ochho hoy to app aagal nahi vadhva de.','Running hours lakho. Diesel vali machine hoy to diesel start ane end lakho; litres potani jate thase.','Jarur hoy to meter nu photo lo, camera ke gallery mathi. Pachhi "Add Record" dabavo.','Bhul hoy to niche history ma pen icon thi edit karo ane dustbin icon thi delete karo; delete pehla app puchhse.'],
 gs:['મેનુમાંથી "ડેટા એન્ટ્રી" ખોલો. તારીખ, પ્લાન્ટ અને ઇક્વિપમેન્ટ પસંદ કરો. ડેટા ૨૪ કલાક પછી લેવાતો હોય તો સેટિંગ્સમાં "ડેટા એન્ટ્રી મોડ" ડેઇલી રાખો, તો શિફ્ટ પૂછશે નહીં. પછી શિફ્ટ પ્રમાણે ડેટા લો તો શિફ્ટ-વાઇઝ કરો.','મીટર સ્ટાર્ટ અને મીટર એન્ડ લખો. એનર્જી કિલોવોટ કલાક આપોઆપ થઈ જશે, એટલે કે મીટર એન્ડ માઇનસ મીટર સ્ટાર્ટ. મીટર એન્ડ સ્ટાર્ટ કરતાં ઓછો હશે તો એપ આગળ વધવા નહીં દે.','રનિંગ અવર્સ લખો. ડીઝલવાળું મશીન હોય તો ડીઝલ સ્ટાર્ટ અને એન્ડ લખો; લિટર આપોઆપ થશે.','જરૂર હોય તો મીટરનો ફોટો લો, કેમેરા કે ગેલેરીમાંથી. પછી "એડ રેકોર્ડ" દબાવો.','ભૂલ હોય તો નીચે હિસ્ટરીમાં પેન આઇકનથી એડિટ કરો અને ડસ્ટબિન આઇકનથી ડિલીટ કરો; ડિલીટ પહેલાં એપ પૂછશે.']},
{ic:'fa-plug-circle-bolt',rg:'Plant no total (main meter) alag',gu:'પ્લાન્ટનો કુલ વપરાશ (મુખ્ય મીટર) અલગ',
 rs:['Menu ma "Plant Total" kholo. Tarikh, plant ane plant ni main meter nu total kWh lakho. Meter start ane end lakho to farak potani jate thase.','Equipment nu kWh alag lakhvanu chhe (Data Entry ke Excel). Plant total ane equipment total no farak "Other / unmetered load" tarike dekhase.','Dashboard, cost ane SEC plant total pramane j dekhase. Equipment page ma "Other / unmetered load" tarike bakino vaparash dekhase.','Equipment total plant total thi vadhu hoy to Alerts ma chetavani aavse. Reading tapaso.','Excel grid ma "Plant Total kWh" sheet ma plant na naam upar ek var lakhi ne roj nu total lakho.'],
 gs:['મેનુમાંથી "પ્લાન્ટ ટોટલ" ખોલો. તારીખ, પ્લાન્ટ અને પ્લાન્ટની મુખ્ય મીટરનો કુલ કિલોવોટ કલાક લખો. મીટર સ્ટાર્ટ અને એન્ડ લખો તો તફાવત આપોઆપ થશે.','ઇક્વિપમેન્ટનું કિલોવોટ કલાક અલગ લખવાનું છે (ડેટા એન્ટ્રી કે એક્સેલમાં). પ્લાન્ટ ટોટલ અને ઇક્વિપમેન્ટ ટોટલનો તફાવત "અધર / અનમીટર્ડ લોડ" તરીકે દેખાશે.','ડેશબોર્ડ, ખર્ચ અને એસઈસી પ્લાન્ટ ટોટલ પ્રમાણે જ દેખાશે. ઇક્વિપમેન્ટ પેજમાં "અધર / અનમીટર્ડ લોડ" તરીકે બાકીનો વપરાશ દેખાશે.','ઇક્વિપમેન્ટ ટોટલ પ્લાન્ટ ટોટલથી વધુ હોય તો એલર્ટ્સમાં ચેતવણી આવશે. રીડિંગ તપાસો.','એક્સેલ ગ્રિડમાં "Plant Total kWh" શીટમાં પ્લાન્ટના નામ ઉપર એક વાર લખીને રોજનું ટોટલ લખો.']},
{ic:'fa-table-cells',rg:'Daily grid Excel (sauthi saral)',gu:'ડેઇલી ગ્રિડ એક્સેલ (સૌથી સરળ)',
 rs:['"Excel Import" ma upar "Daily grid" box chhe. "Download grid template" dabavo. Tamara plant ane equipment na naam pehla thi bharela hase.','Excel ma upar plant ane equipment na naam matra ek var lakho. Pachhi roj matra tarikh ane darek equipment no ek number lakho.','Running hours, diesel litres ane production na alag sheet chhe. Column no kram badlavo nahi.','Meter na reading lakhta ho to "Meter readings" pasand karo, app potani jate pachhla reading no farak kadhi dese. Reading MWh ma hoy to unit MWh pasand karo.','Plant no energy tena equipment nu total potani jate thase.','"Import grid file" dabavo, preview joi ne Confirm Import dabavo.'],
 gs:['"એક્સેલ ઇમ્પોર્ટ"માં ઉપર "ડેઇલી ગ્રિડ" બોક્સ છે. "ડાઉનલોડ ગ્રિડ ટેમ્પલેટ" દબાવો. તમારા પ્લાન્ટ અને ઇક્વિપમેન્ટના નામ પહેલેથી ભરેલા હશે.','એક્સેલમાં ઉપર પ્લાન્ટ અને ઇક્વિપમેન્ટના નામ માત્ર એક વાર લખો. પછી રોજ માત્ર તારીખ અને દરેક ઇક્વિપમેન્ટનો એક નંબર લખો.','રનિંગ અવર્સ, ડીઝલ લિટર અને પ્રોડક્શનની અલગ શીટ છે. કૉલમનો ક્રમ બદલશો નહીં.','મીટરના રીડિંગ લખતા હો તો "મીટર રીડિંગ્સ" પસંદ કરો, એપ આપોઆપ પાછલા રીડિંગનો તફાવત કાઢી દેશે. રીડિંગ એમડબ્લ્યુએચમાં હોય તો યુનિટ એમડબ્લ્યુએચ પસંદ કરો.','પ્લાન્ટનો એનર્જી તેના ઇક્વિપમેન્ટનું કુલ આપોઆપ થશે.','"ઇમ્પોર્ટ ગ્રિડ ફાઇલ" દબાવો, પ્રીવ્યૂ જોઈને કન્ફર્મ ઇમ્પોર્ટ દબાવો.']},
{ic:'fa-file-import',rg:'Excel import',gu:'એક્સેલ ઇમ્પોર્ટ',
 rs:['Menu ma "Excel Import" kholo. Template download karo ane tema tamaro data bharo.','"Tap to choose your file" dabavo ane phone ni Files, Drive ke Downloads mathi Excel ke CSV file pasand karo.','App columns ne potani jate match karse. Match na thay to upar mapping ma sudharo.','Preview ma bhul vali ane duplicate rows dekhase. Barabar lagey tyare "Confirm Import" dabavo. Bhul vali rows import nahi thay; teno error report download kari shakay.'],
 gs:['મેનુમાંથી "એક્સેલ ઇમ્પોર્ટ" ખોલો. ટેમ્પલેટ ડાઉનલોડ કરો અને તેમાં તમારો ડેટા ભરો.','"ફાઇલ પસંદ કરવા ટૅપ કરો" દબાવો અને ફોનની ફાઇલ્સ, ડ્રાઇવ કે ડાઉનલોડ્સમાંથી એક્સેલ કે સીએસવી ફાઇલ પસંદ કરો.','એપ કૉલમ આપોઆપ મેળવી લેશે. ન મળે તો ઉપર મેપિંગમાં સુધારો કરો.','પ્રીવ્યૂમાં ભૂલવાળી અને ડુપ્લિકેટ લાઇનો દેખાશે. બરાબર લાગે ત્યારે "કન્ફર્મ ઇમ્પોર્ટ" દબાવો. ભૂલવાળી લાઇનો ઇમ્પોર્ટ નહીં થાય; તેનો એરર રિપોર્ટ ડાઉનલોડ કરી શકાય.']},
{ic:'fa-gauge-high',rg:'Dashboard ane filters',gu:'ડેશબોર્ડ અને ફિલ્ટર',
 rs:['Dashboard par Global Filters ma tarikh, plant, area, equipment ane shift pasand karo. Badhi figure ane chart badlai jase.','Upar na cards ma kWh, diesel, cost, SEC ane target achievement dekhase. Card dabavo to vadhu vigat khule.','Chart ma plant ke bar dabavo to e plant nu drill-down khule. "More charts" ma vadhu chart chhe.','Dark ane light theme badalva upar na half-moon button vapro.'],
 gs:['ડેશબોર્ડ પર ગ્લોબલ ફિલ્ટરમાં તારીખ, પ્લાન્ટ, એરિયા, ઇક્વિપમેન્ટ અને શિફ્ટ પસંદ કરો. બધા આંકડા અને ચાર્ટ બદલાઈ જશે.','ઉપરના કાર્ડમાં કિલોવોટ કલાક, ડીઝલ, ખર્ચ, એસઈસી અને ટાર્ગેટ પ્રાપ્તિ દેખાશે. કાર્ડ દબાવો તો વધુ વિગત ખુલે.','ચાર્ટમાં પ્લાન્ટ કે બાર દબાવો તો એ પ્લાન્ટનું ડ્રીલ ડાઉન ખુલે. "મોર ચાર્ટ્સ"માં વધુ ચાર્ટ છે.','ડાર્ક અને લાઇટ થીમ બદલવા ઉપરનું અડધા ચંદ્રનું બટન વાપરો.']},
{ic:'fa-bullseye',rg:'Targets',gu:'ટાર્ગેટ',
 rs:['Menu ma "Targets" kholo. Darek plant mate roj no energy target, diesel target ane SEC target set karo.','Mahina pramane alag target hoy to monthly targets ma mahino pasand kari ne lakho.','Target vs actual, variance, etle actual minus target, ane achievement percent tya jova male.'],
 gs:['મેનુમાંથી "ટાર્ગેટ્સ" ખોલો. દરેક પ્લાન્ટ માટે રોજનો એનર્જી ટાર્ગેટ, ડીઝલ ટાર્ગેટ અને એસઈસી ટાર્ગેટ નક્કી કરો.','મહિના પ્રમાણે અલગ ટાર્ગેટ હોય તો મંથલી ટાર્ગેટ્સમાં મહિનો પસંદ કરીને લખો.','ટાર્ગેટ સામે એક્ચ્યુઅલ, વેરિયન્સ એટલે કે એક્ચ્યુઅલ માઇનસ ટાર્ગેટ, અને સિદ્ધિની ટકાવારી ત્યાં જોવા મળશે.']},
{ic:'fa-triangle-exclamation',rg:'Alerts',gu:'એલર્ટ',
 rs:['"Alerts" ma abnormal vaparash ni list male chhe: vadhu kWh, rated thi vadhu load, diesel target thi vadhu, meter ni bhul vagere.','Critical, etle lal, alerts pehla jovo. Pachhi warning, etle pila.','Alerts nu threshold badalvu hoy to Alerts page par thresholds ma badlo.'],
 gs:['"એલર્ટ્સ"માં અસામાન્ય વપરાશની યાદી મળે છે: વધુ કિલોવોટ કલાક, રેટેડ કરતાં વધુ લોડ, ડીઝલ ટાર્ગેટથી વધુ, મીટરની ભૂલ વગેરે.','ક્રિટિકલ, એટલે કે લાલ, એલર્ટ પહેલા જુઓ. પછી વોર્નિંગ, એટલે કે પીળા.','એલર્ટની મર્યાદા બદલવી હોય તો એલર્ટ્સ પેજ પર થ્રેશોલ્ડમાં બદલો.']},
{ic:'fa-gas-pump',rg:'Diesel stock ane DG',gu:'ડીઝલ સ્ટોક અને ડીજી',
 rs:['Menu ma "Diesel" kholo. Opening stock ane reorder level set karo.','Diesel aave tyare diesel received ma litres ane rate lakho. Tank ma mapela litres, etle physical dip, pan lakhi shakay.','Closing stock etle opening plus received minus vaparash plus adjustment. Dip sathe farak pan dekhase.','DG table ma darek DG no kWh per litre, cost per kWh, load ane thermal efficiency dekhase.'],
 gs:['મેનુમાંથી "ડીઝલ" ખોલો. ઓપનિંગ સ્ટોક અને રિઓર્ડર લેવલ નક્કી કરો.','ડીઝલ આવે ત્યારે ડીઝલ રિસીવ્ડમાં લિટર અને રેટ લખો. ટાંકીમાં માપેલા લિટર, એટલે કે ફિઝિકલ ડિપ, પણ લખી શકાય.','ક્લોઝિંગ સ્ટોક એટલે ઓપનિંગ વત્તા આવક, ઓછા વપરાશ, વત્તા એડજસ્ટમેન્ટ. ડિપ સાથેનો તફાવત પણ દેખાશે.','ડીજી ટેબલમાં દરેક ડીજીનું કિલોવોટ કલાક પ્રતિ લિટર, ખર્ચ પ્રતિ કિલોવોટ કલાક, લોડ અને થર્મલ એફિશિયન્સી દેખાશે.']},
{ic:'fa-file-export',rg:'Reports ane WhatsApp summary',gu:'રિપોર્ટ અને વોટ્સએપ સમરી',
 rs:['"Reports" ma report pasand kari "Preview" dabavo. Pachhi Excel ke PDF download karo, ke print karo. CSV Energy Data table mathi male chhe.','Report upar na filter pramane j bane chhe, etle pehla tarikh ane plant pasand karo.','Dashboard par "WhatsApp" button dabavo: aaj no summary taiyar thase. "Open WhatsApp" dabavo, group ke vyakti pasand karo ane send karo.'],
 gs:['"રિપોર્ટ્સ"માં રિપોર્ટ પસંદ કરી "પ્રીવ્યૂ" દબાવો. પછી એક્સેલ કે પીડીએફ ડાઉનલોડ કરો, કે પ્રિન્ટ કરો. સીએસવી એનર્જી ડેટા ટેબલમાંથી મળે છે.','રિપોર્ટ ઉપરના ફિલ્ટર પ્રમાણે જ બને છે, એટલે પહેલા તારીખ અને પ્લાન્ટ પસંદ કરો.','ડેશબોર્ડ પર "વોટ્સએપ" બટન દબાવો: આજની સમરી તૈયાર થશે. "ઓપન વોટ્સએપ" દબાવો, ગ્રુપ કે વ્યક્તિ પસંદ કરો અને મોકલો.']},
{ic:'fa-bolt',rg:'DGVCL Incomer Meter ane Bill (CT ratio sathe)',gu:'ડીજીવીસીએલ ઇનકમર મીટર અને બિલ (સીટી રેશિયો સાથે)',
 rs:['Menu ma "Incomer Meter & Bill" kholo. Sauthi pehla Meter setup ma CT ratio, jem ke 200 upar 5, PT ratio, jem ke 11000 upar 110, ane meter constant lakho. App potani jate Multiplying Factor, etle MF, banavi dese. MF tamara DGVCL bill par pan lakhelo hoy chhe, tena sathe match karo.','Contract demand ane tariff pan tya set karo.','Roj ke jyare reading lo tyare kWh, kVAh ane MD, etle maximum demand kVA ma, lakho. Peak ane din na 11 thi 17 kalak na kVAh register hoy to e pan lakhi shakay.','Vaparash etle reading no farak guni MF. Power factor etle kWh bhago kVAh.','"Bill calculator" ma period pasand karo. App demand charge, energy charge, power factor rebate ke penalty, FPPAS ane electricity duty gani ne kul bill ane rupiya per kWh batavse. Darek item ni gananti pan niche dekhase.','Tamara asli DGVCL bill no amount nakho to calculated ane asli bill no farak dekhase. Farak vadhu hoy to Tariff settings ma FPPAS ane duty bill pramane sudharo.','"Save to Electricity Bill page" dabavo to e bill Electricity Bill ma jai jase.','Meter ma reading MWh ma dekhatu hoy to Meter setup ma "Meter shows energy in" ma MWh / MVAh pasand karo. App potani jate hazar thi guni ne kWh banavi dese. Demand MVA ma hoy to "Meter shows demand in" ma MVA pasand karo.','Ghana reading ek sathe nakhva "Sample / template file" download karo, Excel ma reading bharo ane "Import readings" thi upload karo.','Reports ma "Incomer Meter & DGVCL Bill Report" thi Excel, PDF ke print report male chhe.'],
 gs:['મેનુમાંથી "ઇનકમર મીટર એન્ડ બિલ" ખોલો. સૌથી પહેલા મીટર સેટઅપમાં સીટી રેશિયો, જેમ કે ૨૦૦ ઉપર ૫, પીટી રેશિયો, જેમ કે ૧૧૦૦૦ ઉપર ૧૧૦, અને મીટર કોન્સ્ટન્ટ લખો. એપ આપોઆપ મલ્ટિપ્લાઇંગ ફેક્ટર, એટલે કે એમએફ, બનાવી દેશે. એમએફ તમારા ડીજીવીસીએલ બિલ પર પણ લખેલો હોય છે, તેની સાથે મેળવો.','કોન્ટ્રાક્ટ ડિમાન્ડ અને ટેરિફ પણ ત્યાં નક્કી કરો.','રોજ કે જ્યારે રીડિંગ લો ત્યારે કિલોવોટ કલાક, કિલોવોલ્ટ એમ્પિયર કલાક અને એમડી, એટલે કે મેક્સિમમ ડિમાન્ડ કેવીએમાં, લખો. પીક અને દિવસના ૧૧ થી ૧૭ કલાકના કેવીએએચ રજિસ્ટર હોય તો એ પણ લખી શકાય.','વપરાશ એટલે રીડિંગનો તફાવત ગુણ્યા એમએફ. પાવર ફેક્ટર એટલે કિલોવોટ કલાક ભાગ્યા કેવીએએચ.','"બિલ કેલ્ક્યુલેટર"માં સમયગાળો પસંદ કરો. એપ ડિમાન્ડ ચાર્જ, એનર્જી ચાર્જ, પાવર ફેક્ટર રિબેટ કે પેનલ્ટી, એફપીપીએએસ અને ઇલેક્ટ્રિસિટી ડ્યુટી ગણીને કુલ બિલ અને રૂપિયા પ્રતિ કિલોવોટ કલાક બતાવશે. દરેક આઇટમની ગણતરી પણ નીચે દેખાશે.','તમારા અસલ ડીજીવીસીએલ બિલની રકમ નાખો તો ગણેલા અને અસલ બિલનો તફાવત દેખાશે. તફાવત વધુ હોય તો ટેરિફ સેટિંગ્સમાં એફપીપીએએસ અને ડ્યુટી બિલ પ્રમાણે સુધારો.','"સેવ ટુ ઇલેક્ટ્રિસિટી બિલ પેજ" દબાવો તો એ બિલ ઇલેક્ટ્રિસિટી બિલમાં જતું રહેશે.','મીટરમાં રીડિંગ મેગાવોટ કલાકમાં દેખાતું હોય તો મીટર સેટઅપમાં "મીટર શોઝ એનર્જી ઇન"માં એમડબ્લ્યુએચ પસંદ કરો. એપ આપોઆપ હજાર વડે ગુણીને કિલોવોટ કલાક બનાવી દેશે. ડિમાન્ડ એમવીએમાં હોય તો "ડિમાન્ડ ઇન"માં એમવીએ પસંદ કરો.','ઘણા રીડિંગ એકસાથે નાખવા "સેમ્પલ ટેમ્પલેટ ફાઇલ" ડાઉનલોડ કરો, એક્સેલમાં રીડિંગ ભરો અને "ઇમ્પોર્ટ રીડિંગ્સ"થી અપલોડ કરો.','રિપોર્ટ્સમાં "ઇનકમર મીટર એન્ડ ડીજીવીસીએલ બિલ રિપોર્ટ"થી એક્સેલ, પીડીએફ કે પ્રિન્ટ રિપોર્ટ મળે છે.']},
{ic:'fa-file-invoice',rg:'Electricity bill check',gu:'ઇલેક્ટ્રિસિટી બિલ ચેક',
 rs:['"Electricity Bill" ma mahine ni DISCOM bill ni units, amount, max demand, contract demand ane power factor lakho.','App tamara meter ni units sathe compare karse: 2 percent sudhi barabar, 5 percent sudhi check, tyar pachhi mismatch.','Max demand contract thi vadhu hoy ke power factor 0.90 thi ochho hoy to flag aave chhe.'],
 gs:['"ઇલેક્ટ્રિસિટી બિલ"માં મહિનાના વીજ બિલની યુનિટ, રકમ, મેક્સિમમ ડિમાન્ડ, કોન્ટ્રાક્ટ ડિમાન્ડ અને પાવર ફેક્ટર લખો.','એપ તમારા મીટરના યુનિટ સાથે સરખામણી કરશે: બે ટકા સુધી બરાબર, પાંચ ટકા સુધી ચેક, ત્યાર પછી મિસમેચ.','મેક્સિમમ ડિમાન્ડ કોન્ટ્રાક્ટથી વધુ હોય કે પાવર ફેક્ટર શૂન્ય દશાંશ નવ શૂન્યથી ઓછો હોય તો ફ્લેગ આવે છે.']},
{ic:'fa-shield-halved',rg:'Backup ane restore',gu:'બેકઅપ અને રિસ્ટોર',
 rs:['"Data Backup" ma JSON backup download karo. Roj nahi to hafte ek var jarur karo.','Data tamara browser ma save thay chhe. Browser no data clear karsho ke phone badlso to data jai shake chhe, etle backup rakhvo.','Data parat lavva Data Backup ma backup file pasand karo, preview jovo ane Restore dabavo.','Badho data kadhi nakhva "Clear all data" chhe. Pehla backup lo; DELETE lakhvu padse.'],
 gs:['"ડેટા બેકઅપ"માં જેસન બેકઅપ ડાઉનલોડ કરો. રોજ નહીં તો અઠવાડિયે એક વાર જરૂર કરો.','ડેટા તમારા બ્રાઉઝરમાં સેવ થાય છે. બ્રાઉઝરનો ડેટા ક્લિયર કરશો કે ફોન બદલશો તો ડેટા જઈ શકે છે, એટલે બેકઅપ રાખવો.','ડેટા પાછો લાવવા ડેટા બેકઅપમાં બેકઅપ ફાઇલ પસંદ કરો, પ્રીવ્યૂ જુઓ અને રિસ્ટોર દબાવો.','બધો ડેટા કાઢી નાખવા "ક્લિયર ઓલ ડેટા" છે. પહેલા બેકઅપ લો; ડિલીટ લખવું પડશે.']},
{ic:'fa-mobile-screen',rg:'Phone ma vaparva mate tips',gu:'ફોનમાં વાપરવા માટેની ટિપ્સ',
 rs:['Phone ma niche bottom menu thi Home, Entry, Diesel, Alerts ane More khulse. Badhi pages mate upar na menu button thi sidebar kholo.','Moti table ne jamni ke dabi bajuo swipe karo.','Darek phone ma potano data alag hoy chhe. Ek j phone thi entry karo, ke ek j file Excel import ma vapro. Badha phone ma ek data jova mate haji online sync joie.'],
 gs:['ફોનમાં નીચે બોટમ મેનુથી હોમ, એન્ટ્રી, ડીઝલ, એલર્ટ્સ અને મોર ખુલશે. બધા પેજ માટે ઉપરના મેનુ બટનથી સાઇડબાર ખોલો.','મોટી ટેબલને જમણી કે ડાબી બાજુ સ્વાઇપ કરો.','દરેક ફોનમાં પોતાનો ડેટા અલગ હોય છે. એક જ ફોનથી એન્ટ્રી કરો, કે એક જ ફાઇલ એક્સેલ ઇમ્પોર્ટમાં વાપરો. બધા ફોનમાં એક ડેટા જોવા માટે હજી ઓનલાઇન સિંક જોઈએ.']},
{ic:'fa-cloud',rg:'Login ane ghana device ma ek j data',gu:'લૉગિન અને ઘણા ડિવાઇસમાં એક જ ડેટા',
 rs:['Admin pehla Settings ma Cloud sync ma Firebase ni API key ane Database URL nakhi Connect kare chhe. Setup steps tya "Setup steps" button ma chhe.','Admin "Users" button thi darek vyakti no email, password ane role banave: admin, operator ke viewer. Operator data entry kare chhe, viewer fakt jue chhe.','Admin "Setup link" aape. Te link phone ke PC par kholo, pachhi tamara email ane password thi sign in karo.','Pehli var biji device par "Use cloud data" pasand karo, jethi cloud no data aavi jay. Pachhi koi pan device par entry karo, thodi vaar ma badhi device ma dekhase.','Internet na hoy to pan entry chale chhe. Internet aave tyare data aapo-aap sync thay chhe. Upar na nana golā ma sync nu status dekhay chhe: lilo etle synced, pilo etle chaltu.'],
 gs:['એડમિન પહેલા સેટિંગ્સમાં ક્લાઉડ સિંકમાં ફાયરબેઝની એપીઆઈ કી અને ડેટાબેઝ યુઆરએલ નાખીને કનેક્ટ કરે છે. સેટઅપ સ્ટેપ્સ ત્યાં "સેટઅપ સ્ટેપ્સ" બટનમાં છે.','એડમિન "યુઝર્સ" બટનથી દરેક વ્યક્તિનો ઇમેઇલ, પાસવર્ડ અને રોલ બનાવે છે: એડમિન, ઓપરેટર કે વ્યૂઅર. ઓપરેટર ડેટા એન્ટ્રી કરે છે, વ્યૂઅર ફક્ત જુએ છે.','એડમિન "સેટઅપ લિંક" આપે છે. એ લિંક ફોન કે પીસી પર ખોલો, પછી તમારા ઇમેઇલ અને પાસવર્ડથી સાઇન ઇન કરો.','પહેલી વાર બીજા ડિવાઇસ પર "યુઝ ક્લાઉડ ડેટા" પસંદ કરો, જેથી ક્લાઉડનો ડેટા આવી જાય. પછી કોઈ પણ ડિવાઇસ પર એન્ટ્રી કરો, થોડી વારમાં બધા ડિવાઇસમાં દેખાશે.','ઇન્ટરનેટ ન હોય તો પણ એન્ટ્રી ચાલે છે. ઇન્ટરનેટ આવે ત્યારે ડેટા આપોઆપ સિંક થાય છે. ઉપરના નાના ગોળામાં સિંકનું સ્ટેટસ દેખાય છે: લીલો એટલે સિંક થયું, પીળો એટલે ચાલુ છે.']},
{ic:'fa-square-root-variable',rg:'Mukhya formulas',gu:'મુખ્ય ફોર્મ્યુલા',
 rs:['Energy etle meter end minus meter start. Diesel etle diesel end minus diesel start.','SEC etle energy bhago production. Diesel specific etle diesel bhago production.','Variance etle actual minus target. Variance percent etle variance bhago target, guna sau.','Zero thi bhag thato hoy tyare app "dash" batave chhe, error nahi. Badha formula nu live check "Formulas" page par chhe.'],

function canon(v){if(v===null||v===undefined||(typeof v==='number'&&!isFinite(v)))return'';

    if(!chk(kwh,nz(p&&p.kwh,pf),nz(nx&&nx.kwh,nf),'kWh')||!chk(kvah,nz(p&&p.kvah,pf),nz(nx&&nx.kvah,nf),'kVAh'))return}
  const rec={date,kwh,kvah,md,kvahPk:pk,kvahOff:off,reset:reset?1:0,mf:meterMF(),ef,mdf,remarks:f.remarks.value.trim()};
  if(S.mrEdit){const o=DB.mreads.find(x=>x.id===S.mrEdit);rec.mf=o.mf||rec.mf;Object.assign(o,rec);S.mrEdit=''}else DB.mreads.push({id:uid(),...rec});
  save();toast('Reading saved');render()}
function mrEdit(id){S.mrEdit=id;render();window.scrollTo(0,0)}
function mrCancel(){S.mrEdit='';render()}
function mrDel(id){ask('Delete this reading?','The reading will be permanently deleted.','Delete reading',()=>{DB.mreads=DB.mreads.filter(x=>x.id!==id);if(S.mrEdit===id)S.mrEdit='';save();toast('Reading deleted');render()})}
function tariffSave(ev){ev.preventDefault();const f=ev.target.elements,T=tariffCfg(),v=k=>Number(f[k].value)||0,sl=(arr,key)=>arr.map((x,i)=>[v(key+i+'w'),v(key+i+'r')]);
  DB.tariff={...T,dSlabs:sl(T.dSlabs,'d'),eSlabs:sl(T.eSlabs,'e'),touPk:sl(T.touPk,'t'),excess:v('excess'),floorPct:v('floorPct'),minKva:v('minKva'),touOff:v('touOff'),fppas:v('fppas'),fppasSur:v('fppasSur'),duty:v('duty'),other:v('other')};save();toast('Tariff saved');render()}
function tariffReset(){ask('Reset tariff values?','All tariff settings go back to the FY 2026-27 starting values (including FPPAS and duty).','Reset',()=>{DB.tariff=TARIFF_DEF();save();toast('Tariff reset');render()},false)}
/* ============ render ============ */
function render(){
  if(S.view==='entry'&&!S.noCap&&document.getElementById('ef_date'))S.ef=efRead();S.noCap=false;
  const V={dash:renderDash,trends:renderTrends,plants:renderPlants,equip:renderEquip,entry:renderEntry,ptotal:renderPtot,data:renderData,import:renderImport,diesel:renderDiesel,targets:renderTargets,cost:renderCost,kpi:renderKpi,alerts:renderAlerts,reports:renderReports,master:renderMaster,assets:renderMaster,formulas:renderFormulas,bills:renderBills,meter:renderMeter,help:renderHelp,eqd:renderEqDetail,backup:renderBackup,settings:renderSettings};
  Object.keys(CH).forEach(k=>{CH[k].destroy();delete CH[k]});
  ensureMaster();EQM=eqMap();validate(DF);validate(F);
  buildNav();$('#view').innerHTML=sampleBanner()+(V[S.view]||renderDash)();header();addTips();
  if(S.view==='data')dtDraw();if(S.view==='import')impDraw();
  animateCounters();
  $('#view').style.animation='none';void $('#view').offsetWidth;$('#view').style.animation=''}
window.addEventListener&&['dragover','drop'].forEach(n=>window.addEventListener(n,e=>{if(!(e.target&&e.target.closest&&e.target.closest('#drop')))e.preventDefault()}));
try{const t=localStorage.getItem('emds_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
save();tick();setInterval(tick,1000);render();Cloud.boot();
</script>
