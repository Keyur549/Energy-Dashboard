<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Electrical Energy & Diesel Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg1:#050b18;--bg2:#0a1630;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--bd:rgba(120,190,255,.15);--tx:#eaf2ff;--muted:#8fa3c4;--grid:rgba(143,163,196,.14);--acc:#22d3ee;--acc2:#3b82f6;--amber:#fbbf24;--green:#34d399;--red:#f87171;--violet:#a78bfa;--shadow:0 12px 34px rgba(0,0,0,.38);--side:rgba(6,14,32,.82);--inp:rgba(255,255,255,.07);--line:rgba(255,255,255,.035)}
[data-theme=light]{--bg1:#eef3fb;--bg2:#dce8f9;--card:rgba(255,255,255,.74);--card2:rgba(255,255,255,.95);--bd:rgba(30,64,175,.13);--tx:#0f1b33;--muted:#58698a;--grid:rgba(30,64,175,.1);--acc:#0891b2;--acc2:#2563eb;--amber:#d97706;--green:#059669;--red:#dc2626;--violet:#7c3aed;--shadow:0 10px 28px rgba(30,64,175,.12);--side:rgba(255,255,255,.85);--inp:rgba(15,27,51,.05);--line:rgba(30,64,175,.045)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(1100px 560px at 85% -10%,rgba(34,211,238,.16),transparent 60%),radial-gradient(900px 520px at -10% 25%,rgba(59,130,246,.18),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;font-size:14px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.app{display:flex;position:relative;z-index:1;min-height:100vh}
aside{width:244px;flex:none;position:fixed;top:0;bottom:0;left:0;background:var(--side);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:6px;z-index:40;transition:transform .3s}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:18px;box-shadow:0 0 22px rgba(34,211,238,.45)}
.brand b{font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:.8px;display:block}
.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:1px solid transparent;border-radius:12px;padding:11px 12px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500;transition:.2s}
.nav button i{width:20px;text-align:center}
.nav button:hover{background:var(--card);color:var(--tx);transform:translateX(3px)}
.nav button.on{background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(59,130,246,.1));border-color:var(--bd);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nav button.on i{color:var(--acc)}
.sidefoot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:12px;color:var(--muted)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:6px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.main{flex:1;margin-left:244px;min-width:0;display:flex;flex-direction:column}
header{position:relative;display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--side);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:grid;place-items:center;position:relative;transition:.2s;flex:none}
.hbtn:hover{background:var(--card2);transform:translateY(-2px)}
#menuBtn{display:none}
.htitle{flex:1;min-width:0}
.htitle .co{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;line-height:1.25;flex:none}
.clock b{font-family:Orbitron,sans-serif;font-size:15px;display:block}
.clock span{font-size:11px;color:var(--muted)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.prof{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;flex:none}
.av{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--acc2));display:grid;place-items:center;color:#fff;font-weight:700}
.prof div{line-height:1.2}.prof small{color:var(--muted);font-size:11px}
#pop{position:fixed;top:62px;right:20px;width:340px;max-width:calc(100vw - 24px);z-index:60;display:none;padding:14px;border-radius:16px;background:var(--card2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--shadow)}
#pop.show{display:block;animation:rise .25s}
#pop h4{margin-bottom:8px}
.pi{padding:9px 0;border-top:1px solid var(--bd);font-size:12.5px}.pi small{color:var(--muted);display:block}
#view{padding:22px 24px 40px;animation:rise .4s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);transition:.25s}
.glass:hover{border-color:rgba(34,211,238,.35)}
.pt{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.pt h2{font-size:20px;flex:1;min-width:180px}.pt h2 small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
input,select{background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;outline:none;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
select option{background:#0d1a36;color:#eaf2ff}[data-theme=light] select option{background:#fff;color:#0f1b33}
.seg{display:flex;background:var(--inp);border-radius:11px;padding:3px}
.seg button{border:none;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn{border:none;cursor:pointer;padding:10px 16px;border-radius:11px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));display:inline-flex;align-items:center;gap:8px;transition:.2s;box-shadow:0 6px 18px rgba(34,211,238,.25);white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.sec{background:var(--inp);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.amb{background:linear-gradient(135deg,#f59e0b,#ef4444)}.btn.grn{background:linear-gradient(135deg,#10b981,#059669)}
.btn.sm{padding:6px 10px;font-size:12px;box-shadow:none}
/* filters */
.fpanel{padding:14px 16px;margin-bottom:18px}
.fpanel summary{cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;list-style:none;flex-wrap:wrap}
.fpanel summary::-webkit-details-marker{display:none}
.fpanel .chips{display:flex;flex-wrap:wrap;gap:6px;font-weight:500}
.fpanel[open] summary .fa-chevron-down{transform:rotate(180deg)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-top:14px}
.fgrid label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fact{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.fnote{font-size:11.5px;color:var(--muted);flex:1;min-width:200px}
.ptag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--inp);color:var(--muted);margin-bottom:3px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-4px)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c);opacity:.12;filter:blur(2px)}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--c);margin-bottom:10px;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent)}
.kpi .lb{color:var(--muted);font-size:12px;font-weight:500}
.kpi .v{font-size:25px;font-weight:800;margin:3px 0;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.dl{font-size:11.5px;font-weight:600}.dl.g{color:var(--green)}.dl.b{color:var(--red)}.dl.n{color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--inp);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width 1s}
.kpis.sm .kpi{padding:13px}.kpis.sm .kpi .v{font-size:20px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:2fr 1fr}
.card{padding:16px}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}.card h3 i{color:var(--acc)}
.card h3 .r{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.cbox{position:relative;height:280px}.cbox.s{height:250px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:hover td{background:var(--inp)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.chip.g{background:rgba(52,211,153,.16);color:var(--green)}.chip.a{background:rgba(251,191,36,.16);color:var(--amber)}.chip.r{background:rgba(248,113,113,.18);color:var(--red)}.chip.x{background:var(--inp);color:var(--muted)}.chip.b{background:rgba(34,211,238,.15);color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500}
.empty{padding:34px;text-align:center;color:var(--muted)}.empty i{font-size:30px;display:block;margin-bottom:10px;color:var(--acc);opacity:.7}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.alrt{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--bd);font-size:13px}.alrt:first-child{border-top:none}
.alrt i{margin-top:3px}.alrt small{color:var(--muted);display:block}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.mini div{padding:12px;border-radius:12px;background:var(--inp)}.mini b{font-size:19px;display:block}.mini span{font-size:11.5px;color:var(--muted)}
.bnav{display:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{padding:11px 18px;border-radius:12px;background:var(--card2);border:1px solid var(--bd);box-shadow:var(--shadow);backdrop-filter:blur(14px);animation:rise .3s;font-weight:500}
.tst.err{border-color:var(--red)}.tst.ok{border-color:var(--green)}
#bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
tr.click{cursor:pointer}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.rule:hover{transform:translateY(-2px)}.rule.sel{border-color:var(--acc)}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:.2s}
.drop i{font-size:34px;color:var(--acc)}.drop span{color:var(--muted);font-size:13px}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(34,211,238,.08);transform:translateY(-2px)}
.okb{padding:9px 12px;border-radius:10px;background:rgba(52,211,153,.12);color:var(--green);font-size:12.5px;margin-bottom:10px}.okb i{margin-right:8px}
button.chip{border:none;cursor:pointer;font-family:inherit}.chip.sel{outline:2px solid var(--acc)}.crumb{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}.crumb i{font-size:9px}.crumb a{cursor:pointer;color:var(--acc);font-weight:600}.crumb a:hover{text-decoration:underline}.crumb b{color:var(--tx)}
.rcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.rc{padding:16px;display:flex;flex-direction:column;gap:6px}.rc.sel{outline:2px solid var(--acc)}.rc h4{font-size:14.5px}.rc p{color:var(--muted);font-size:12.5px;flex:1;margin-bottom:6px}.rci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--inp);color:var(--acc);font-size:16px}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px}.mbox{max-width:500px;width:100%;padding:22px;max-height:92vh;overflow:auto}.mbox h3{margin-bottom:12px}.mb p{margin-bottom:10px;font-size:13.5px;line-height:1.5}.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:10px 0;cursor:pointer}.chk input{width:auto;margin-top:2px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;color:#000;background:#fff;padding:0;font-family:Arial,sans-serif}#printArea h1{font-size:18px;margin-bottom:6px}#printArea h2{font-size:14px;margin:14px 0 6px}#printArea p{font-size:11px;margin-bottom:8px}#printArea table{width:100%;border-collapse:collapse;font-size:9.5px}#printArea th,#printArea td{border:1px solid #999;padding:3px 5px;text-align:left;color:#000}#printArea td.n,#printArea th.n{text-align:right}#printArea th{background:#e5e7eb}#printArea .chip{background:none!important;color:#000!important}@page{size:landscape;margin:10mm}}
.kc{cursor:pointer;transition:outline-color .2s}
td code{white-space:normal;word-break:break-word;font-size:12px}@media(max-width:700px){td code{display:block;min-width:190px}}
.thumb{width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer}.phb{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.show-t{display:none}@media(pointer:coarse){.hide-t{display:none}.show-t{display:inline}}
/* ---- layout safety: let grid / flex children shrink instead of stretching the page ---- */
.grid>*,.form>*,.kpis>*,.pt>*,.glass,.card{min-width:0;max-width:100%}.cbox{overflow:hidden}.tw{max-width:100%}
aside{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.chk input{width:20px;min-width:20px;height:20px;min-height:20px;flex:none;margin-top:1px}body.menu-open .bnav{display:none!important}body.menu-open{overflow:hidden}#menuBtn{display:grid}body.nosb aside{transform:translateX(-105%)}body.nosb .main{margin-left:0}
/* ---- touch-friendly sizes (phones & tablets) ---- */
@media(max-width:900px),(pointer:coarse){
 .btn{min-height:44px}.btn.sm{min-height:42px;min-width:42px;padding:8px 13px}
 input,select{min-height:44px;font-size:16px}
 td input,td select,th input,th select{min-height:40px}
 #nav button{min-height:46px}.bnav button{min-height:54px}.mtabs .btn{min-height:44px}
 a.lnk,.crumb a{display:inline-block;padding:11px 3px;margin:-6px 0}
 .tst{max-width:calc(100vw - 24px)}
 .chip[onclick],.seg button{min-height:40px}
}
@media(max-width:480px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid input,.fgrid select{padding:9px 8px}}
@media(max-width:700px){.cbox{height:240px}.cbox.s{height:220px}.pt .acts,.pt>div:last-child{width:100%}.acts .btn{flex:1 1 auto;justify-content:center}.mbox{padding:18px;max-height:88vh}.modal{align-items:flex-end;padding:0}.mbox{border-radius:20px 20px 0 0;max-width:none}}
@media(max-width:700px) and (orientation:landscape){.cbox{height:200px}.cbox.s{height:190px}}
.ng{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 14px 4px;font-weight:700}
.mtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}.mtabs .btn{white-space:nowrap}
.sbn{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border-radius:14px;border:1px solid var(--amber);background:rgba(251,191,36,.1);font-size:13px}.sbn>i{color:var(--amber);font-size:18px}.sbn>div:nth-child(2){flex:1;min-width:220px}
.lnk{color:var(--acc);cursor:pointer;font-weight:600}.lnk:hover{text-decoration:underline}
.tst::before{margin-right:9px;font-weight:700}.tst.ok::before{content:'\2714';color:var(--green)}.tst.err::before{content:'\2716';color:var(--red)}.tst.warn{border-color:var(--amber)}.tst.warn::before{content:'\26A0';color:var(--amber)}.tst.info{border-color:var(--acc)}.tst.info::before{content:'\2139';color:var(--acc)}.kc.sel{outline:2px solid var(--acc)}
tr.imp-error td{background:rgba(248,113,113,.07)}tr.imp-dup td{background:rgba(56,189,248,.06)}tr.imp-warn td{background:rgba(251,191,36,.05)}
td.iss{white-space:normal;min-width:260px}.is{display:block;font-size:11.5px}.is.error{color:var(--red)}.is.warn{color:var(--amber)}.is.dup{color:#38bdf8}.is.info{color:var(--muted)}
.dtbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.srch{position:relative;flex:1;min-width:220px}.srch i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.srch input{padding-left:34px}.dtbar select{width:auto}
th.sortable{cursor:pointer;user-select:none}th.sortable.on{color:var(--acc)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.pinfo{color:var(--muted);font-size:12.5px}.pbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pdots{color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.fsec{font-weight:700;font-size:12px;margin:18px 0 10px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}.fsec:first-of-type{margin-top:4px}
.fe{display:block;color:var(--red);font-size:11.5px;margin-top:3px}.fe:empty{display:none}.hint{display:block;color:var(--muted);font-size:11px;margin-top:3px}
input.bad,select.bad{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(248,113,113,.18)}
input[readonly]{opacity:.7}input:disabled{opacity:.5}

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dates=(f,t)=>{const o=[];let d=f,i=0;while(d<=t&&i<800){o.push(d);d=addDays(d,1);i++}return o};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const lbl=d=>{const x=new Date(d+'T00:00:00');return x.getDate()+' '+MN[x.getMonth()]};
const fmt=(n,d=0)=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
let uidN=0;const uid=()=>'i'+Date.now().toString(36)+(uidN++).toString(36)+Math.random().toString(36).slice(2,6);
const cur=()=>DB.settings.cur||'₹';
const money=n=>cur()+' '+fmt(n);
const pu=()=>DB.settings.prodUnit==='Units'?{n:'Units',s:'unit',p:'Unit'}:{n:'Tonnes',s:'t',p:'Ton'};
const secU=()=>'kWh/'+pu().p;
const SHIFTS=['A','B','C','D'],SH3=['A','B','C'],SHN={A:'Shift A (06–14)',B:'Shift B (14–22)',C:'Shift C (22–06)',D:'Full day (24 hours)'};
const shLab=s=>s==='D'?'Full day':'Shift '+s,shDisp=s=>s==='D'?'Full day':(s||'A'),shTag=x=>x&&x.shift&&x.shift!=='D'?' (Shift '+x.shift+')':'';
const entryMode=()=>(DB.settings&&DB.settings.entryMode)||'daily';
const shList=a=>SHIFTS.filter(s=>a.shift[s]&&(a.shift[s].kwh>0||a.shift[s].l>0)),shiftData=a=>shList(a).some(s=>s!=='D'),hasShiftRecs=()=>DB.energy.some(x=>(x.shift||'A')!=='D')||DB.diesel.some(x=>(x.shift||'A')!=='D');
const toast=(m,t='ok')=>{const e=document.createElement('div');e.className='tst '+t;e.textContent=m;if(e.setAttribute)e.setAttribute('role',t==='err'?'alert':'status');$('#toast').appendChild(e);setTimeout(()=>e.remove(),t==='err'||t==='warn'?5200:3200)};
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
const uniq=a=>[...new Set(a)].sort((x,y)=>String(x).localeCompare(String(y)));
const normShift=v=>{const s=String(v||'').trim().toUpperCase().replace(/^SHIFT\s*/,'')[0];return SHIFTS.includes(s)?s:'A'};

/* ============ data ============ */
function emptyDB(){return{v:5,settings:{company:'Your Plant / Company Name',loc:'',user:'Plant Admin',role:'Energy Manager',cur:'₹',prodUnit:'Tonnes',tariff:8.5,dieselRate:92,co2e:0.82,co2d:2.68},plants:[],equip:[],energy:[],diesel:[],prod:[],stock:{opening:0,date:'',reorder:0,capacity:0},dieselRecv:[],dieselAdj:[],dieselDips:[],mtargets:{},areas:[],etypes:[],rates:{e:[],d:[]},bills:[],mreads:[],ptot:[],meter:null,tariff:null,sample:false}}
const BASE_ET=['DG Set','Transformer','Motor','Pump','Compressor','Boiler','Furnace','HVAC','Chiller','Other'];const ETYPES=[...BASE_ET];
const DG_BENCH=3.5;
const LEG={'Heater':'Other','Vehicle':'Other','Conveyor':'Motor','Welding':'Other','CNC Machine':'Motor','Grinder':'Motor','Press':'Motor','Cooling':'Other','General':'Other'};
/* ============ data layer: schema, adapters, store, repository ============ */
/* The UI never talks to localStorage directly. It reads/writes the in-memory model `DB` and calls save().
   save() -> Store.save() -> active adapter(s). To use another backend, add an adapter below (see RemoteAdapter)
   or implement the same 3 methods: pull(), push(db), test(). */
const LS='emds_v1',LS_CFG='emds_backend';
const SCHEMA={version:5,
  collections:{plants:'Plant master',equip:'Equipment master',energy:'Energy readings',diesel:'Diesel readings',prod:'Production',dieselRecv:'Diesel receipts',dieselAdj:'Diesel adjustments',dieselDips:'Dip readings',bills:'Electricity bills',mreads:'Incomer meter readings',ptot:'Plant total (main meter)',areas:'Areas',etypes:'Custom equipment types'},
  documents:{settings:'Company, tariff and defaults',stock:'Diesel stock setup',mtargets:'Monthly targets',rates:'Dated energy / diesel rates'}};
const LocalAdapter={
  name:'Browser LocalStorage',
  load(){const t=localStorage.getItem(LS);return t?JSON.parse(t):null},
  save(db){localStorage.setItem(LS,JSON.stringify(db))},
  bytes(){try{return (localStorage.getItem(LS)||'').length*2}catch(e){return 0}}
};
/* Remote adapters: whole-document sync over HTTPS. 'rest' = any server exposing GET/PUT on one URL (JSON body = database).
   'firebase' = Firebase Realtime Database REST API (URL like https://PROJECT-default-rtdb.firebaseio.com , optional auth token). */
function RemoteAdapter(cfg){
  const base=(cfg.url||'').trim().replace(/\/+$/,'');
  const url=cfg.mode==='firebase'?base+'/emds.json'+(cfg.token?'?auth='+encodeURIComponent(cfg.token):''):base;
  const hdr=()=>{const h={'Content-Type':'application/json'};if(cfg.mode==='rest'&&cfg.token)h.Authorization='Bearer '+cfg.token;return h};
  const chk=r=>{if(!r.ok)throw new Error('Server answered '+r.status+' '+(r.statusText||''));return r};
  return{name:cfg.mode==='firebase'?'Firebase Realtime Database':'REST API',
    async pull(){const r=chk(await fetch(url,{headers:hdr(),cache:'no-store'}));const t=await r.text();return t&&t!=='null'?JSON.parse(t):null},
    async push(db){chk(await fetch(url,{method:'PUT',headers:hdr(),body:JSON.stringify(db)}))},
    async test(){if(!/^https?:\/\//i.test(base))throw new Error('Enter a full URL starting with https://');const t0=Date.now();chk(await fetch(url,{headers:hdr(),cache:'no-store'}));return Date.now()-t0}};
}
const Store={
  meta:{saved:0,bytes:0,persist:null,quota:0,remote:{state:'off',last:0,err:''}},
  _t:null,
  cfg(){let c={};try{c=JSON.parse(localStorage.getItem(LS_CFG)||'{}')}catch(e){}return{mode:'local',url:'',token:'',auto:true,...c}},
  setCfg(c){try{localStorage.setItem(LS_CFG,JSON.stringify(c))}catch(e){}this.meta.remote={state:c.mode==='local'?'off':'idle',last:this.meta.remote.last,err:''}},
  adapter(){const c=this.cfg();return c.mode==='local'?null:RemoteAdapter(c)},
  /* validate + upgrade any stored/imported database to the current version */
  hydrate(d){if(!d||!d.plants||!d.settings)return null;if((d.v||1)<2&&d.settings.company==='Demo Industries Ltd.')return null;return(d.v||1)<5?migrate(d):d},
  load(){try{const d=this.hydrate(LocalAdapter.load());if(d)return d}catch(e){}return seedDB()},
  save(db){
    try{db.updatedAt=Date.now();LocalAdapter.save(db)}
    catch(e){const q=e&&(e.name==='QuotaExceededError'||e.code===22);toast(q?'Storage full – export a backup and clear old data':'This browser is blocking storage, so data cannot be saved. Open the app from a web link or a normal file location in Chrome.','err');return false}
    this.meta.saved=db.updatedAt;this.meta.bytes=LocalAdapter.bytes();
    if(typeof Cloud!=='undefined')Cloud.queue();
    const c=this.cfg();if(c.mode!=='local'&&c.auto){clearTimeout(this._t);this.meta.remote.state='pending';this._t=setTimeout(()=>this.push(true),1500)}
    return true},
  async push(quiet){const a=this.adapter();if(!a)return false;const R=this.meta.remote;R.state='syncing';
    try{await a.push(DB);R.state='ok';R.last=Date.now();R.err='';if(!quiet)toast('Data sent to '+a.name);}
    catch(e){R.state='error';R.err=e.message||String(e);if(!quiet)toast('Could not send data: '+R.err,'err')}
    if(S.view==='settings')refreshStorageCard();return R.state==='ok'},
  async pull(){const a=this.adapter();if(!a)return null;try{const d=this.hydrate(await a.pull());if(!d)throw new Error('The server has no valid data yet');return d}catch(e){toast('Could not fetch data: '+(e.message||e),'err');return null}},
  async test(){const a=this.adapter();if(!a){toast('Choose REST API or Firebase first','warn');return}
    try{const ms=await a.test();toast('Connection OK ('+ms+' ms)')}catch(e){toast('Connection failed: '+(e.message||e),'err')}},
  async estimate(){try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();this.meta.quota=e.quota||0}if(navigator.storage&&navigator.storage.persisted)this.meta.persist=await navigator.storage.persisted()}catch(e){}},
  async keep(){try{if(navigator.storage&&navigator.storage.persist){this.meta.persist=await navigator.storage.persist()}}catch(e){}}
};
/* Repository: one place for record CRUD so a backend can later replace the bodies without touching the UI */
const Repo={
  list(c){return DB[c]||[]},
  get(c,id){return this.list(c).find(x=>x.id===id)},
  add(c,rec){rec.id=rec.id||uid();(DB[c]=DB[c]||[]).push(rec);save();return rec},
  update(c,id,patch){const r=this.get(c,id);if(!r)return null;Object.assign(r,patch);save();return r},
  remove(c,id){const a=this.list(c),i=a.findIndex(x=>x.id===id);if(i<0)return false;a.splice(i,1);save();return true},
  replaceAll(db){DB=db;save()}
};
function renderStorageCard(){
  const c=Store.cfg(),M=Store.meta,R=M.remote,kb=(M.bytes||LocalAdapter.bytes())/1024;
  const st={off:['Local only','n'],idle:['Not synced yet','a'],pending:['Waiting to send…','a'],syncing:['Sending…','a'],ok:['In sync','g'],error:['Error','r']}[R.state]||['—','n'];
  return`<div class="glass card" id="stCard"><h3><i class="fa-solid fa-hard-drive"></i>Data storage &amp; simple server copy</h3>
  <div class="kv" style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px"><span style="color:var(--muted)">Primary storage</span><b>Browser LocalStorage (auto-saved on every change)</b>
   <span style="color:var(--muted)">Size used</span><b>${kb<1024?kb.toFixed(0)+' KB':(kb/1024).toFixed(2)+' MB'} of about 5 MB</b>
   <span style="color:var(--muted)">Last saved</span><b>${M.saved?new Date(M.saved).toLocaleTimeString('en-IN'):'—'}</b>
   <span style="color:var(--muted)">Browser protection</span><b>${M.persist===true?'Protected from automatic clean-up':M.persist===false?'Not protected — keep backups':'Unknown'}</b>
   <span style="color:var(--muted)">Remote sync</span><b><span class="chip ${st[1]}">${st[0]}</span>${R.last?' · last '+new Date(R.last).toLocaleTimeString('en-IN'):''}${R.err?'<br><small style="color:var(--red)">'+esc(R.err)+'</small>':''}</b></div>
  <form class="form" style="grid-template-columns:minmax(0,1fr)" onsubmit="saveBackendCfg(event)">
   <div><label>Backend (optional)</label><select name="mode" onchange="backendModeChg(this)"><option value="local" ${c.mode==='local'?'selected':''}>None — browser only</option><option value="rest" ${c.mode==='rest'?'selected':''}>REST API (GET / PUT JSON)</option></select></div>
   <div class="bk" ${c.mode==='local'?'hidden':''}><label>Server URL</label><input name="url" value="${esc(c.url)}" placeholder="https://example.com/api/emds" inputmode="url" autocomplete="off"></div>
   <div class="bk" ${c.mode==='local'?'hidden':''}><label>Access token (optional)</label><input name="token" type="password" value="${esc(c.token)}" autocomplete="off"></div>
   <div class="bk chk" ${c.mode==='local'?'hidden':''}><label><input type="checkbox" name="auto" ${c.auto?'checked':''}> Send changes automatically</label></div>
   <div class="acts"><button class="btn grn"><i class="fa-solid fa-floppy-disk"></i>Save</button><button type="button" class="btn sec bk" ${c.mode==='local'?'hidden':''} onclick="Store.test()"><i class="fa-solid fa-plug"></i>Test</button><button type="button" class="btn sec bk" ${c.mode==='local'?'hidden':''} onclick="backendPush()"><i class="fa-solid fa-cloud-arrow-up"></i>Send now</button><button type="button" class="btn sec bk" ${c.mode==='local'?'hidden':''} onclick="backendPull()"><i class="fa-solid fa-cloud-arrow-down"></i>Fetch</button></div></form>
  <p style="color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5">Data always stays in this browser first, so the app works offline. A backend only receives a copy. Use the same URL on every device to share data.</p></div>`}
function refreshStorageCard(){const el=document.getElementById('stCard');if(!el)return;const t=document.createElement('div');t.innerHTML=renderStorageCard();el.replaceWith(t.firstElementChild)}
function backendModeChg(sel){document.querySelectorAll('#stCard .bk').forEach(e=>{e.hidden=sel.value==='local'})}
function saveBackendCfg(ev){ev.preventDefault();const f=ev.target.elements,c={mode:f.mode.value,url:f.url.value.trim(),token:f.token.value.trim(),auto:f.auto.checked};
  if(c.mode!=='local'&&!/^https?:\/\//i.test(c.url)){toast('Enter a full server URL starting with https://','err');return}
  Store.setCfg(c);toast(c.mode==='local'?'Backend disabled — using browser storage only':'Backend settings saved');refreshStorageCard()}
function backendPush(){Store.push(false)}
function backendPull(){Store.pull().then(d=>{if(!d)return;const n=(d.energy||[]).length+(d.diesel||[]).length;
  ask('Replace local data?',`The server copy has <b>${(d.plants||[]).length}</b> plants and <b>${n}</b> readings${d.updatedAt?' (saved '+new Date(d.updatedAt).toLocaleString('en-IN')+')':''}. Your data in this browser will be <b>replaced</b>. Take a backup first if unsure.`,'Replace data',()=>{Repo.replaceAll(d);toast('Data loaded from server');render()},false)})}
Store.keep();Store.estimate();
(function(){if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('storage',e=>{if(e.key!==LS||!e.newValue)return;try{const d=Store.hydrate(JSON.parse(e.newValue));if(d){DB=d;toast('Data updated from another tab','info');render()}}catch(x){}})})();
let DB=Store.load();
function guessType(e){const n=(e.name||'').toLowerCase();const m=[[/transformer|\btr\b/,'Transformer'],[/\bdg\b|genset|generator/,'DG Set'],[/boiler/,'Boiler'],[/furnace/,'Furnace'],[/chiller/,'Chiller'],[/hvac|\bac\b/,'HVAC'],[/compress/,'Compressor'],[/pump/,'Pump'],[/motor|conveyor|cnc|lathe|grind|press|fan|blower/,'Motor']];for(const[r,t]of m)if(r.test(n))return t;return 'Other'}
function migrate(d){d.settings.prodUnit=d.settings.prodUnit||'Tonnes';let c=0;d.equip.forEach(e=>{e.area=e.area||'General';let t=e.etype||guessType(e);t=LEG[t]||t;if(!ETYPES.includes(t))t=guessType(e);e.etype=t;e.capUnit=e.capUnit||(e.type==='diesel'||t==='Transformer'?'kVA':'kW');e.remarks=e.remarks||'';if(!e.code){c++;e.code='EQ-'+String(c).padStart(3,'0')}});['energy','diesel','prod'].forEach(k=>(d[k]=d[k]||[]).forEach(x=>{if(!x.shift)x.shift='A'}));if(!d.stock)d.stock={opening:0,date:'',reorder:0,capacity:0};d.dieselRecv=d.dieselRecv||[];d.dieselAdj=d.dieselAdj||[];d.dieselDips=d.dieselDips||[];d.mtargets=d.mtargets||{};d.v=5;return d}
function save(){return Store.save(DB)}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedDB(){
  const R=rng(2026),rr=(a,b)=>a+(b-a)*R(),db=emptyDB();

  const d={kwh:p.mKWh!=null?p.mKWh:(p.tKWh||0)*30,diesel:p.mDiesel!=null?p.mDiesel:(p.tDiesel||0)*30,sec:p.tSEC||0,prod:p.mProd||0},g=k=>o[k]!=null?o[k]:d[k];
  return{kwh:g('kwh'),diesel:g('diesel'),sec:g('sec'),prod:g('prod'),ov:['kwh','diesel','sec','prod'].some(k=>o[k]!=null)}}
function withF(o,fn){const s=F;F={...defaultF(),...o};try{return fn()}finally{F=s}}
const ALERT_CATS=[['eqHigh','Equipment high energy','fa-microchip'],['surge','Sudden kWh increase','fa-arrow-trend-up'],['planttgt','Plant energy above target','fa-bullseye'],['dieselTgt','Diesel above target','fa-gas-pump'],['sec','SEC above limit','fa-gauge'],['stock','Diesel stock below minimum','fa-oil-well'],['dgLph','Excessive DG litres / hour','fa-stopwatch'],['dgEff','Low DG efficiency','fa-leaf'],['meter','Missing / broken meter reading','fa-gauge-simple-high'],['data','Invalid data','fa-database']];
const ALERT_DEF={dgMin:2.8,surge:30,plantOver:15,secOver:10,dieselOver:25,lphOver:10};
const AL=()=>({...ALERT_DEF,...(DB.settings.alert||{})});

function computeAlerts(f,to,useF=true){
  const out=[],EQ=eqMap(),PL=plMap(),U=pu().p,A=AL();
  const add=(date,sev,cat,plant,equip,type,msg)=>out.push({date,sev,cat,plantId:plant||'',equipId:equip||'',plant:PL[plant]?.name||'—',equip:equip?(EQ[equip]?.name||'—'):'—',type,msg});
  const inD=x=>x.date>=f&&x.date<=to,base=x=>inD(x)&&(!useF||!F.plant||x.plant===F.plant),sc=x=>inD(x)&&(!useF||scopeOK(x));
  const w1=A.plantOver/100,s1=A.secOver/100,d1=A.dieselOver/100,u1=A.surge/100,l1=A.lphOver/100;
  const lvl=(r,m)=>r>1+2*m?'critical':r>1+m?'warning':null;
  /* equipment high energy / invalid data */
  const st={};DB.energy.forEach(x=>(st[x.equip]=st[x.equip]||[]).push(x.kwh));
  const ms={};for(const k in st){const a=st[k];if(a.length<10)continue;const m=a.reduce((s,v)=>s+v,0)/a.length;ms[k]={m,sd:Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length)}}
  DB.energy.filter(sc).forEach(x=>{const e=EQ[x.equip];
    if(x.hours>24)add(x.date,'critical','data',x.plant,x.equip,'Invalid data',`Run hours ${x.hours} exceed 24 h`);
    else if(e&&e.kw>0&&x.hours>0&&(!e.capUnit||e.capUnit==='kW'||e.capUnit==='kVA')&&x.kwh>e.kw*x.hours*1.1)add(x.date,'critical','eqHigh',x.plant,x.equip,'Over rated load',`${fmt(x.kwh)} kWh in ${x.hours} h (Shift ${x.shift||'A'}) exceeds rated ${e.kw} ${e.capUnit||'kW'}`);
    else{const s=ms[x.equip];if(s&&s.sd>0){const z=(x.kwh-s.m)/s.sd;if(z>2.5)add(x.date,z>4?'critical':'warning','eqHigh',x.plant,x.equip,'Consumption spike',`${fmt(x.kwh)} kWh ${shTag(x)} vs normal ${fmt(s.m)} kWh`)}}});
  /* plant daily maps */
  const pday={},pdayAll={};DB.energy.forEach(x=>{if(useF&&F.plant&&x.plant!==F.plant)return;const k=x.plant+'|'+x.date;pdayAll[k]=(pdayAll[k]||0)+x.kwh;if(inD(x))pday[k]=pdayAll[k]});
  for(const k in pday){const[pid,d]=k.split('|'),mo=d.slice(0,7),t=tgt(pid,mo).kwh/dim(mo);if(!(t>0))continue;const r=pday[k]/t,s=lvl(r,w1);if(s)add(d,s,'planttgt',pid,null,'Plant over target',`${fmt(pday[k])} kWh = ${(r*100).toFixed(0)}% of daily target ${fmt(t)}`)}
  /* sudden increase vs trailing 7 days */
  for(const k in pday){const[pid,d]=k.split('|');const prev=[];for(let i=1;i<=7;i++){const v=pdayAll[pid+'|'+addDays(d,-i)];if(v>0)prev.push(v)}if(prev.length<4)continue;const avg=prev.reduce((s,v)=>s+v,0)/prev.length,r=pday[k]/avg,s=lvl(r,u1);if(s)add(d,s,'surge',pid,null,'Sudden kWh increase',`${fmt(pday[k])} kWh is +${((r-1)*100).toFixed(0)}% vs the previous 7-day average ${fmt(avg)}`)}
  /* diesel above target */
  const dd={};DB.diesel.filter(base).forEach(x=>{dd[x.plant+'|'+x.date]=(dd[x.plant+'|'+x.date]||0)+x.litres});
  for(const k in dd){const[pid,d]=k.split('|'),mo=d.slice(0,7),t=tgt(pid,mo).diesel/dim(mo);if(!(t>0))continue;const r=dd[k]/t,s=lvl(r,d1);if(s)add(d,s,'dieselTgt',pid,null,'Diesel over target',`${fmt(dd[k])} L = ${(r*100).toFixed(0)}% of daily target ${fmt(t,1)} L`)}
  /* SEC */
  const ptot={};DB.prod.filter(base).forEach(x=>{ptot[x.plant+'|'+x.date]=(ptot[x.plant+'|'+x.date]||0)+x.tons});
  for(const k in ptot){const[pid,d]=k.split('|'),t=tgt(pid,d.slice(0,7)).sec,kk=pday[k];if(!(t>0)||!ptot[k]||kk===undefined)continue;const sec=kk/ptot[k],s=lvl(sec/t,s1);if(s)add(d,s,'sec',pid,null,'SEC above limit',`${sec.toFixed(1)} kWh/${U} vs target ${t}`)}
  /* DG checks */
  DB.diesel.filter(sc).forEach(x=>{const e=EQ[x.equip];
    if(x.kwhGen>0&&x.litres>0){const ef=x.kwhGen/x.litres;if(ef<A.dgMin)add(x.date,ef<A.dgMin*.85?'critical':'warning','dgEff',x.plant,x.equip,'Low DG efficiency',`${ef.toFixed(2)} kWh/L (minimum ${A.dgMin})`)}
    if(e&&e.etype==='DG Set'&&x.hours>0&&e.kw>0){const full=(e.capUnit==='kVA'?e.kw*.8:e.kw)*.28,lph=x.litres/x.hours,s=lvl(lph/full,l1);if(s)add(x.date,s,'dgLph',x.plant,x.equip,'Excessive DG L/hr',`${lph.toFixed(1)} L/h vs full-load ≈ ${full.toFixed(0)} L/h (${(lph/full*100).toFixed(0)}%)`)}});
  /* diesel stock below minimum (site-wide) */
  if(!(useF&&F.plant)){ensureStock();const L=stockLedger(f,to),mn=+DB.stock.reorder||0;
    if(L&&mn>0&&L.rows.length){let prev=null;L.rows.forEach((r,i)=>{const below=r.close<mn,last=i===L.rows.length-1;if(below&&((prev!==null&&prev>=mn)||(prev===null&&i===0)||last)){add(r.date,r.close<mn*.5?'critical':'warning','stock','','','Diesel stock low',`Closing stock ${fmt(r.close)} L is below the minimum ${fmt(mn)} L${last?' (current)':''}`)}prev=r.close})}}
  /* meter readings */
  const byE={};[...DB.energy.map(x=>({...x,k:'e'})),...DB.diesel.filter(x=>x.kwhGen>0||x.meterStart!=null).map(x=>({...x,k:'d'}))].forEach(x=>(byE[x.equip]=byE[x.equip]||[]).push(x));
  for(const id in byE){const arr=byE[id].sort((a,b)=>(a.date+(a.shift||'A')).localeCompare(b.date+(b.shift||'A'))),has=arr.some(x=>x.meterStart!=null&&x.meterEnd!=null);if(!has)continue;let prevEnd=null;
    arr.forEach(x=>{const ok=x.meterStart!=null&&x.meterEnd!=null;
      if(inD(x)&&(!useF||scopeOK(x))){
        if(!ok)add(x.date,'warning','meter',x.plant,id,'Missing meter reading',`No meter start/end recorded ${shTag(x)} although this equipment is metered`);
        else if(prevEnd!==null&&Math.abs(x.meterStart-prevEnd)>1){const dlt=x.meterStart-prevEnd;add(x.date,dlt<0?'critical':'warning','meter',x.plant,id,dlt<0?'Meter rollback':'Meter gap',dlt<0?`Meter start ${fmt(x.meterStart)} is below the previous end ${fmt(prevEnd)}`:`Meter start ${fmt(x.meterStart)} is ${fmt(dlt)} above the previous end ${fmt(prevEnd)} — unrecorded consumption`)}}
      if(ok)prevEnd=x.meterEnd})}
  /* plant main meter vs equipment total */
  (DB.ptot||[]).forEach(x=>{if(!inD(x)||(useF&&!scopeOK({...x,shift:x.shift||'A'})))return;const eq=DB.energy.filter(e=>e.plant===x.plant&&e.date===x.date).reduce((a,e)=>a+e.kwh,0);if(eq>x.kwh*1.005&&eq>0)add(x.date,'warning','meter',x.plant,'','Equipment total above plant meter',`Equipment total ${fmt(eq)} kWh is more than the plant total ${fmt(x.kwh)} kWh - check the readings`)});
  out.sort((a,b)=>b.date.localeCompare(a.date)||(a.sev==='critical'?-1:1)-(b.sev==='critical'?-1:1));return out}

/* ============ views ============ */
function pageTitle(t,sub,extra=''){return`<div class="pt"><h2>${t}<small>${sub}</small></h2>${extra}</div>`}
function noPlants(){return`<div class="glass empty"><i class="fa-solid fa-industry"></i>No plants configured yet.<br><br><button class="btn" onclick="go('master')">Add plants &amp; equipment</button> <button class="btn sec" onclick="loadDemo()">Load demo data</button></div>`}
function delta(c,p,goodDown=true,lab='prev period'){if(!p)return`<span class="dl n">— no ${lab} data</span>`;const pc=(c-p)/p*100,up=pc>=0,good=goodDown?!up:up;return`<span class="dl ${Math.abs(pc)<.05?'n':good?'g':'b'}"><i class="fa-solid fa-arrow-${up?'up':'down'}"></i> ${Math.abs(pc).toFixed(1)}% vs ${lab}</span>`}
function kpi(ic,label,val,dec,unit,color,sub,pre=''){return`<div class="kpi glass" style="--c:${color}"><div class="ic"><i class="fa-solid ${ic}"></i></div><div class="lb" title="${esc(KTIP[label]||label)}">${label}</div><div class="v">${pre}<span data-count="${val}" data-dec="${dec}">0</span><small>${unit}</small></div>${sub}</div>`}
function animateCounters(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,dec=+el.dataset.dec,t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e,dec);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

function renderDash(){
  if(!DB.plants.length)return pageTitle('Dashboard','Overview')+noPlants();
  const r=getRange(),pr=prevRange(r),a=agg(r),pv=agg(pr),n=a.days.length,P=pu(),U=P.p,tag=`<span class="ptag">${periodTag(r)}</span><br>`,lab=pr.label;
  const d=(c,p,gd)=>tag+delta(c,p,gd,lab);
  const al=computeAlerts(r.f,r.to),eqF=hasEq();
  const ach=a.tPeriod?a.kwh/a.tPeriod*100:0,achC=ach>115?'var(--red)':ach>100?'var(--amber)':'var(--green)';
  const effC=!a.eff?'var(--muted)':a.eff>=100?'var(--green)':a.eff>=90?'var(--amber)':'var(--red)';
  const dgE=a.dgL?a.dgK/a.dgL:0,tot=a.ecost+a.dcost,ptot=pv.ecost+pv.dcost;
  const main=[
   kpi('fa-bolt','Total Energy Consumption',a.kwh,0,'kWh','var(--acc)',d(a.kwh,pv.kwh,true)),
   kpi('fa-gas-pump','Total Diesel Consumption',a.litres,0,'Litres','var(--amber)',d(a.litres,pv.litres,true)),
   kpi('fa-indian-rupee-sign','Total Energy Cost',a.ecost,0,'','var(--acc2)',d(a.ecost,pv.ecost,true),cur()),
   kpi('fa-droplet','Total Diesel Cost',a.dcost,0,'','#fb923c',d(a.dcost,pv.dcost,true),cur()),
   kpi('fa-boxes-stacked','Total Production',a.prodTot,1,P.n,'var(--violet)',d(a.prodTot,pv.prodTot,false)),
   kpi('fa-gauge','Specific Energy Consumption',a.sec,1,secU(),'var(--green)',d(a.sec,pv.sec,true)),
   kpi('fa-oil-can','Diesel Specific Consumption',a.dsc,2,'Litre/'+U,'#f472b6',d(a.dsc,pv.dsc,true)),
   kpi('fa-leaf','Overall Energy Efficiency',a.eff,1,'%',effC,tag+(a.tSEC?`<span class="dl n">Target ${fmt(a.tSEC,0)} ÷ actual ${fmt(a.sec,0)} ${secU()}</span>`:'<span class="dl n">Set SEC targets to enable</span>')+`<div class="bar"><i style="width:${Math.min(100,a.eff)}%"></i></div>`)].join('');
  const second=[
   `<div class="kpi glass" style="--c:${achC}"><div class="ic"><i class="fa-solid fa-bullseye"></i></div><div class="lb">Target Achievement</div><div class="v"><span data-count="${ach}" data-dec="1">0</span><small>% of target</small></div>${a.partial?'<span class="dl n">n/a with shift / equipment filter</span>':`<span class="dl n">${fmt(a.kwh)} / ${fmt(a.tPeriod)} kWh</span><div class="bar"><i style="width:${Math.min(100,ach)}%"></i></div>`}</div>`,
   kpi('fa-coins','Total Energy + Diesel Cost',tot,0,'','var(--violet)',d(tot,ptot,true),cur()),
   kpi('fa-triangle-exclamation','Abnormalities',al.length,0,'found',al.some(x=>x.sev==='critical')?'var(--red)':'var(--amber)',`<span class="dl n">${al.filter(x=>x.sev==='critical').length} critical • ${al.filter(x=>x.sev!=='critical').length} warning</span>`),
   kpi('fa-engine','DG Efficiency',dgE,2,'kWh/L','#f472b6',`<span class="dl ${!dgE?'n':dgE>=2.8?'g':'b'}">${dgE?(dgE>=2.8?'Healthy':'Below 2.8 limit'):'No DG data'}</span>`),
   kpi('fa-smog','CO₂ Emission',a.co2,1,'tCO₂','#2dd4bf',d(a.co2,pv.co2,true))].join('');
  const plRows=Object.values(a.plant).filter(pl=>!eqF||pl.in).map(pl=>{const tg=a.partial?0:pl.p.tKWh*n,v=tg?(pl.kwh-tg)/tg*100:0,sec=pl.prod&&pl.kwh?pl.kwh/pl.prod:0;
    const chip=a.partial?'<span class="chip x">Filtered</span>':!tg?'<span class="chip x">No target</span>':v>15?'<span class="chip r">Over target</span>':v>0?'<span class="chip a">Watch</span>':'<span class="chip g">On track</span>';
    return`<tr class="click" onclick="openPlant('${pl.p.id}')"><td><b>${esc(pl.p.name)}</b> <i class="fa-solid fa-chevron-right" style="color:var(--muted);font-size:10px"></i></td><td class="n">${fmt(pl.kwh)}</td><td class="n">${tg?fmt(tg):'—'}</td><td class="n" style="color:${v>0?'var(--red)':'var(--green)'}">${tg?(v>0?'+':'')+v.toFixed(1)+'%':'—'}</td><td class="n">${fmt(pl.l)}</td><td class="n">${pl.prod?fmt(pl.prod,1):'—'}</td><td class="n">${sec?sec.toFixed(1):'—'}</td><td class="n">${money(pl.ec+pl.dc)}</td><td>${chip}</td></tr>`}).join('');
  const eqRows=Object.entries(a.eq).sort((x,y)=>y[1].kwh-x[1].kwh).map(([id,q])=>{const e=EQM[id]||{name:'(deleted)',kw:0,plant:''};const lf=e.kw&&q.h?q.kwh/(e.kw*q.h)*100:0;
    return`<tr class="click" onclick="openEq('${id}')"><td><b>${esc(e.name)}</b></td><td>${esc(plMap()[e.plant]?.name||'')}</td><td>${esc(e.area||'General')}</td><td>${esc(e.etype||'General')}</td><td class="n">${fmt(q.kwh)}</td><td class="n">${a.kwh?(q.kwh/a.kwh*100).toFixed(1):0}%</td><td class="n">${fmt(q.h,1)}</td><td class="n">${lf?lf.toFixed(0)+'%':'—'}</td><td class="n">${money(q.ec)}</td></tr>`}).join('');

function dashCharts(a){

  chartBase();const days=a.days,L=days.map(lbl),P=pu();
  const ds=[{label:'Actual kWh',data:days.map(d=>a.dKwh[d]),backgroundColor:'rgba(34,211,238,.6)',hoverBackgroundColor:'#22d3ee',borderRadius:4}];
  if(!a.partial&&a.tDay)ds.push({type:'line',label:'Target kWh',data:days.map(()=>a.tDay),borderColor:'#fbbf24',borderDash:[6,4],borderWidth:2,pointRadius:0});
  mk('cTrend',{type:'bar',data:{labels:L,datasets:ds},options:{interaction:{mode:'index',intersect:false},scales:{x:{...gridless,ticks:{maxTicksLimit:10}},y:{beginAtZero:true}}}});
  const pl=Object.values(a.plant).filter(x=>x.in&&(x.kwh>0||x.l>0));
  mk('cShare',{type:'doughnut',data:{labels:pl.map(x=>x.p.name),datasets:[{data:pl.map(x=>x.kwh),backgroundColor:PAL,borderWidth:0,hoverOffset:8}]},options:{cutout:'66%',plugins:{legend:{position:'bottom'}}}});
  mk('cDiesel',{type:'bar',data:{labels:L,datasets:[{label:'Litres',data:days.map(d=>a.dL[d]),backgroundColor:'rgba(251,191,36,.65)',borderRadius:4,yAxisID:'y'},{type:'line',label:`Cost (${cur()})`,data:days.map(d=>Math.round(a.dC[d])),borderColor:'#f472b6',tension:.35,pointRadius:0,borderWidth:2,yAxisID:'y1'}]},options:{interaction:{mode:'index',intersect:false},scales:{x:{...gridless,ticks:{maxTicksLimit:8}},y:{beginAtZero:true},y1:{position:'right',grid:{display:false},beginAtZero:true}}}});
  mk('cCost',{type:'bar',data:{labels:pl.map(x=>x.p.name),datasets:[{label:'Electricity',data:pl.map(x=>Math.round(x.ec)),backgroundColor:'#3b82f6',borderRadius:4},{label:'Diesel',data:pl.map(x=>Math.round(x.dc)),backgroundColor:'#fbbf24',borderRadius:4}]},options:{scales:{x:{...gridless,stacked:true},y:{stacked:true,beginAtZero:true}}}});
  const sec=days.map(d=>{let k=0,p=0;for(const pid in a.prodD){if(!a.plant[pid].in)continue;const t=a.prodD[pid][d];if(t>0){p+=t;k+=a.pd[pid][d]||0}}return p?+(k/p).toFixed(1):null});
  const prd=days.map(d=>{let p=0;for(const pid in a.prodD){if(a.plant[pid].in)p+=a.prodD[pid][d]||0}return p?+p.toFixed(1):null});
  const sds=[{type:'bar',label:'Production ('+P.n+')',data:prd,backgroundColor:'rgba(167,139,250,.45)',borderRadius:4,yAxisID:'y1',order:2},{type:'line',label:'SEC ('+secU()+')',data:sec,borderColor:'#34d399',tension:.35,pointRadius:0,borderWidth:2,spanGaps:true,yAxisID:'y',order:1}];
  if(a.tSEC)sds.push({type:'line',label:'SEC target',data:days.map(()=>a.tSEC),borderColor:'#fbbf24',borderDash:[6,4],pointRadius:0,borderWidth:2,yAxisID:'y',order:0});
  mk('cSec',{data:{labels:L,datasets:sds},options:{interaction:{mode:'index',intersect:false},scales:{x:{...gridless,ticks:{maxTicksLimit:8}},y:{beginAtZero:false},y1:{position:'right',grid:{display:false},beginAtZero:true}}}});
  mk('cShift',{type:'bar',data:{labels:shList(a).map(shLab),datasets:[{label:'Energy (kWh)',data:shList(a).map(s=>a.shift[s].kwh),backgroundColor:'rgba(34,211,238,.65)',borderRadius:6,yAxisID:'y'},{label:'Diesel (L)',data:shList(a).map(s=>a.shift[s].l),backgroundColor:'rgba(251,191,36,.7)',borderRadius:6,yAxisID:'y1'}]},options:{scales:{x:gridless,y:{beginAtZero:true},y1:{position:'right',grid:{display:false},beginAtZero:true}}}});
  const eq=Object.entries(a.eq).sort((x,y)=>y[1].kwh-x[1].kwh).slice(0,8);
  mk('cEq',{type:'bar',data:{labels:eq.map(([id])=>EQM[id]?.name||'?'),datasets:[{label:'kWh',data:eq.map(([,q])=>q.kwh),backgroundColor:eq.map((_,i)=>PAL[i%8]),borderRadius:5}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{y:gridless,x:{beginAtZero:true}}}});
  const ar=Object.entries(a.area).sort((x,y)=>y[1]-x[1]).slice(0,10);
  mk('cArea',{type:'bar',data:{labels:ar.map(x=>x[0]),datasets:[{label:'kWh',data:ar.map(x=>x[1]),backgroundColor:ar.map((_,i)=>PAL[(i+2)%8]),borderRadius:5}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{y:gridless,x:{beginAtZero:true}}}});
  const dq=Object.entries(a.dq).sort((x,y)=>y[1].l-x[1].l);
  mk('cDq',{type:'doughnut',data:{labels:dq.map(([id])=>EQM[id]?.name||'?'),datasets:[{data:dq.map(([,q])=>q.l),backgroundColor:['#fbbf24','#fb923c','#f472b6','#a78bfa','#94a3b8'],borderWidth:0,hoverOffset:8}]},options:{cutout:'62%',plugins:{legend:{position:'bottom'}}}});
}

/* ============ diesel stock model ============ */
function ensureStock(){if(!DB.stock)DB.stock={opening:0,date:'',reorder:0,capacity:0};DB.dieselRecv=DB.dieselRecv||[];DB.dieselAdj=DB.dieselAdj||[];DB.dieselDips=DB.dieselDips||[]}
/* Closing = Opening + Received - Consumption + Adjustment, rolled day by day from the opening-stock date. Site-wide (not plant filtered). */
function stockLedger(from,to){
  ensureStock();const st=DB.stock;if(!st.date)return null;
  const start=from>st.date?from:st.date;if(start>to)return{rows:[],start,before:true};
  const cons={},rec={},adj={},dip={};
  DB.diesel.forEach(x=>{cons[x.date]=(cons[x.date]||0)+x.litres});
  DB.dieselRecv.forEach(x=>{rec[x.date]=(rec[x.date]||0)+x.litres});
  DB.dieselAdj.forEach(x=>{adj[x.date]=(adj[x.date]||0)+x.litres});
  DB.dieselDips.forEach(x=>{dip[x.date]=x.litres});
  const rows=[];let d=st.date,run=+st.opening||0,i=0;
  while(d<=to&&i<1500){const o=run,r=rec[d]||0,c=cons[d]||0,j=adj[d]||0;run=o+r-c+j;
    if(d>=start){const ph=dip[d];rows.push({date:d,open:o,rec:r,cons:c,adj:j,close:run,phys:ph===undefined?null:ph,vari:ph===undefined?null:ph-run})}
    d=addDays(d,1);i++}
  return{rows,start,before:false}}
function dgRows(a){
  return DB.equip.filter(e=>e.type==='diesel'&&e.etype==='DG Set'&&eqMasterOK(e)).map(e=>{
    const q=a.dq[e.id]||{l:0,h:0,c:0,g:0,lg:0,cg:0,hg:0},capKW=e.kw?(e.capUnit==='kVA'?e.kw*0.8:e.kw):0;
    return{e,name:e.name,cap:e.kw?`${fmt(e.kw,0)} ${e.capUnit||'kVA'}`:'—',h:q.h,l:q.l,lph:q.h?q.l/q.h:null,g:q.g,dpk:q.g?q.lg/q.g:null,kpl:q.lg&&q.g?q.g/q.lg:null,cpk:q.g?q.cg/q.g:null,load:capKW&&q.hg&&q.g?q.g/(capKW*q.hg)*100:null,therm:CALC.dgEfficiency(q.g,q.lg)}})}

function stockDateOK(d,min){if(!d||d>today()){toast('Enter a valid date (not in the future)','err');return false}if(min&&d<min){toast('Date is before the opening-stock date ('+min+')','err');return false}return true}
function addRecv(ev){ev.preventDefault();ensureStock();const f=ev.target.elements,d=f.date.value,L=+f.litres.value,rt=+f.rate.value;
  if(!stockDateOK(d,DB.stock.date))return;if(!(L>0)){toast('Litres received must be greater than 0','err');return}if(!(rt>0)){toast('Rate per litre must be greater than 0','err');return}
  const cap=+DB.stock.capacity;if(cap>0&&DB.stock.date){const l=stockLedger(d,d),ob=l&&l.rows[0]?l.rows[0].open:0;if(ob+L>cap){ask('Above tank capacity',`Stock would reach <b>${fmt(ob+L)} L</b>, above the tank capacity of ${fmt(cap)} L. Save anyway?`,'Save anyway',()=>recvPush(f,d,L,rt),false);return}}
  recvPush(f,d,L,rt)}
function recvPush(f,d,L,rt){DB.dieselRecv.push({id:uid(),date:d,litres:L,rate:rt,supplier:f.supplier.value.trim(),invoice:f.invoice.value.trim(),remarks:f.remarks.value.trim()});save();toast('Diesel receipt saved');render()}
function addAdj(ev){ev.preventDefault();ensureStock();const f=ev.target.elements,d=f.date.value,L=+f.litres.value,rs=f.reason.value.trim();
  if(!stockDateOK(d,DB.stock.date))return;if(!L||!isFinite(L)){toast('Enter a non-zero adjustment (use − for a loss)','err');return}if(rs.length<3){toast('Please give a reason for the adjustment','err');return}
  DB.dieselAdj.push({id:uid(),date:d,litres:L,reason:rs});save();toast('Adjustment saved');render()}
function addDip(ev){ev.preventDefault();ensureStock();const f=ev.target.elements,d=f.date.value,L=+f.litres.value;
  if(!stockDateOK(d,DB.stock.date))return;if(f.litres.value===''||!(L>=0)){toast('Enter the measured stock (0 or more)','err');return}
  DB.dieselDips=DB.dieselDips.filter(x=>x.date!==d);DB.dieselDips.push({id:uid(),date:d,litres:L,remarks:f.remarks.value.trim()});save();toast('Physical stock saved');render()}
function saveStock(ev){ev.preventDefault();ensureStock();const f=ev.target.elements,op=+f.opening.value,d=f.date.value,rl=+f.reorder.value||0,cp=+f.capacity.value||0;
  if(!stockDateOK(d))return;if(f.opening.value===''||!(op>=0)){toast('Opening stock must be 0 or more','err');return}if(cp>0&&op>cp){toast('Opening stock exceeds tank capacity','err');return}if(cp>0&&rl>cp){toast('Reorder level exceeds tank capacity','err');return}
  DB.stock={opening:op,date:d,reorder:rl,capacity:cp};save();toast('Stock setup saved');render()}

  const capKW=e&&e.kw?(e.capUnit==='kVA'&&(isD)?e.kw*0.8:e.kw):0,okU=e&&(!e.capUnit||e.capUnit==='kW'||e.capUnit==='kVA');

function trBucket(d,g){if(g==='daily')return d;if(g==='weekly'){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}return g==='monthly'?d.slice(0,7):d.slice(0,4)}

function trData(){
  const r=getRange(),a=agg(r),g=S.tr.g,days=a.days,dP={},dSK={},dSP={},dTE={},dTD={};
  days.forEach(d=>{dP[d]=0;dSK[d]=0;dSP[d]=0;dTE[d]=0;dTD[d]=0});
  Object.keys(a.prodD).forEach(pid=>{if(!a.plant[pid]||!a.plant[pid].in)return;const m=a.prodD[pid];for(const d in m){if(dP[d]===undefined)continue;dP[d]+=m[d];if(m[d]>0){dSP[d]+=m[d];dSK[d]+=(a.pd[pid]||{})[d]||0}}});
  if(!a.partial)days.forEach(d=>{const mo=d.slice(0,7),n=dim(mo);Object.values(a.plant).forEach(pl=>{if(!pl.in)return;const t=tgt(pl.p.id,mo);dTE[d]+=t.kwh/n;dTD[d]+=t.diesel/n})});
  const B=new Map();
  days.forEach(d=>{const b=trBucket(d,g);let o=B.get(b);if(!o){o={b,kwh:0,l:0,ec:0,dc:0,prod:0,sk:0,sp:0,te:0,td:0,n:0};B.set(b,o)}o.kwh+=a.dKwh[d];o.l+=a.dL[d];o.ec+=a.dEc[d];o.dc+=a.dC[d];o.prod+=dP[d];o.sk+=dSK[d];o.sp+=dSP[d];o.te+=dTE[d];o.td+=dTD[d];o.n++});
  return{a,rows:[...B.values()],r}}

function trCharts(rows,a){
  if(typeof Chart==='undefined'){document.querySelectorAll('.cbox').forEach(c=>c.innerHTML='<div class="empty">Chart.js could not load. Check internet connection.</div>');return}
  chartBase();const T=S.tr,g=T.g,L=rows.map(x=>trLabel(x.b,g)),type=T.line?'line':'bar',w={daily:7,weekly:4,monthly:3,yearly:2}[g],dense=rows.length>40;

  const ds=(label,data,color)=>({type,label,data,borderColor:color,backgroundColor:type==='bar'?color+'bb':color+'22',borderWidth:2,pointRadius:dense?0:3,pointHoverRadius:5,tension:.3,borderRadius:type==='bar'?4:0,fill:false});

  const tl=(arr,label)=>!a.partial&&arr.some(v=>v>0)?[{type:'line',label,data:arr.map(v=>+v.toFixed(1)),borderColor:'#fbbf24',borderDash:[6,4],pointRadius:0,borderWidth:2,order:0}]:[];
  const opt=(zero=true)=>({interaction:{mode:'index',intersect:false},scales:{x:{...gridless,ticks:{maxTicksLimit:12}},y:{beginAtZero:zero}}});
  const kw=rows.map(x=>Math.round(x.kwh)),li=rows.map(x=>+x.l.toFixed(1));
  mk('tr1',{data:{labels:L,datasets:[ds('Energy (kWh)',kw,'#22d3ee'),...mad(kw,'#0e7490'),...tl(rows.map(x=>x.te),'Target')]},options:opt()});
  mk('tr2',{data:{labels:L,datasets:[ds('Diesel (L)',li,'#fbbf24'),...mad(li,'#b45309'),...tl(rows.map(x=>x.td),'Target')]},options:opt()});

function toYmd(v){if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+6*36e5));
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return`${m[3]}-${pad(m[2])}-${pad(m[1])}`;m=s.match(/^(\d{1,2})[\s\-\/.,]*([A-Za-z]{3})[a-z]*[\s\-\/.,]*(\d{4})/);if(m){const mi=MN.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0)return`${m[3]}-${pad(mi+1)}-${pad(m[1])}`}return''}

/* ============ ENERGY PERFORMANCE INDICATORS ============ */
const KPI_DEFS=()=>{const R=cur();return[
 {k:'kwhUnit',l:'kWh / Unit',u:'kWh/unit',dir:'max',dec:2,ic:'fa-cube',unitOnly:'Units'},
 {k:'kwhTon',l:'kWh / Ton',u:'kWh/t',dir:'max',dec:1,ic:'fa-weight-hanging',unitOnly:'Tonnes'},
 {k:'lTon',l:'Litre / Ton',u:'L/t',dir:'max',dec:3,ic:'fa-oil-can',unitOnly:'Tonnes'},
 {k:'lph',l:'Litre / Hour',u:'L/h',dir:'max',dec:1,ic:'fa-stopwatch'},
 {k:'rkwh',l:R+' / kWh',u:R+'/kWh',dir:'max',dec:2,ic:'fa-plug'},
 {k:'rTon',l:R+' / Ton',u:R+'/t',dir:'max',dec:0,ic:'fa-coins',unitOnly:'Tonnes'},
 {k:'lf',l:'Load Factor',u:'%',dir:'min',dec:1,ic:'fa-gauge-high',note:'Σ kWh ÷ Σ (rated kW × run hours)'},
 {k:'util',l:'Equipment Utilization',u:'%',dir:'min',dec:1,ic:'fa-clock',note:'run hours ÷ available hours'},
 {k:'eff',l:'Equipment Efficiency',u:'%',dir:'min',dec:1,ic:'fa-gears',note:'average of equipment efficiency'},
 {k:'dg',l:'DG Efficiency',u:'kWh/L',dir:'min',dec:2,ic:'fa-leaf',note:'kWh generated ÷ litres'}]};
function kpiCalc(a){
  const P=pu(),ton=P.n==='Tonnes',days=a.days.length,avail=+DB.settings.availHrs||24,pls=Object.values(a.plant).filter(pl=>pl.in&&pl.prod>0),cp=pls.reduce((s,x)=>s+x.ec+x.dc,0),pp=pls.reduce((s,x)=>s+x.prod,0);
  const rows=equipRows(a),el=rows.filter(x=>!x.dies),hrsD=a.D.reduce((s,x)=>s+(x.hours||0),0);
  let ln=0,ld=0;el.forEach(x=>{const e=x.e;if(e.kw>0&&x.hrs>0&&e.etype!=='Transformer'&&(!e.capUnit||e.capUnit==='kW'||e.capUnit==='kVA')){ln+=x.kwh;ld+=e.kw*x.hrs}});
  const runH=el.reduce((s,x)=>s+x.hrs,0),effs=rows.map(x=>x.eff).filter(v=>v!==null);
  return{kwhUnit:!ton&&a.secP?a.sec:null,kwhTon:ton&&a.secP?a.sec:null,lTon:ton&&a.secP?a.dsc:null,lph:hrsD?a.litres/hrsD:null,rkwh:a.kwh?a.ecost/a.kwh:null,rTon:ton&&pp?cp/pp:null,lf:ld?ln/ld*100:null,util:el.length&&days?runH/(el.length*days*avail)*100:null,eff:effs.length?effs.reduce((s,v)=>s+v,0)/effs.length:null,dg:a.dgL?a.dgK/a.dgL:null}}
function kpiDefLim(k,a){const tr=DB.settings.tariff,cp=critPct()/100;
  switch(k){case'kwhUnit':case'kwhTon':return a&&a.tSEC>0?{t:+a.tSEC.toFixed(2),c:+(a.tSEC*cp).toFixed(2)}:null;case'rkwh':return{t:+(tr*1.1).toFixed(2),c:+(tr*1.25).toFixed(2)};case'lf':return{t:60,c:40};case'util':return{t:50,c:30};case'eff':return{t:70,c:55};case'dg':return{t:3,c:2.8};default:return null}}
function kpiLim(k,a){const u=(DB.settings.kpiLim||{})[k];if(u&&u.t!=null)return{t:u.t,c:u.c!=null?u.c:null,custom:true};return kpiDefLim(k,a)}
function kpiStatus(def,v,lim){if(v===null||v===undefined)return'na';if(!lim||lim.t==null)return'none';
  if(def.dir==='max'){if(v<=lim.t)return'good';return lim.c==null||v<=lim.c?'warn':'crit'}
  if(v>=lim.t)return'good';return lim.c==null||v>=lim.c?'warn':'crit'}
const kStI={good:['g','Good'],warn:['a','Warning'],crit:['r','Critical'],none:['x','No limit set'],na:['x','Not available']},kStC={good:'var(--green)',warn:'var(--amber)',crit:'var(--red)',none:'var(--muted)',na:'var(--muted)'};
function kpiBuckets(r){const days=dates(r.f,r.to),n=days.length,g=n<=14?'daily':n<=120?'weekly':'monthly',m=new Map();days.forEach(d=>{const b=trBucket(d,g),o=m.get(b)||{b,f:d,to:d};o.to=d;m.set(b,o)});return{g,list:[...m.values()].slice(-24)}}
function renderKpi(){
  if(!DB.plants.length)return pageTitle('Performance KPIs','')+noPlants();
  const r=getRange(),pr=prevRange(r),a=agg(r),pv=agg(pr),cv=kpiCalc(a),pc=kpiCalc(pv),D=KPI_DEFS(),P=pu(),tag=`<span class="ptag">${periodTag(r)}</span><br>`,lim=(S.kpiLimEdit||{});
  const cards=D.map(d=>{const v=cv[d.k],l=kpiLim(d.k,a),st=kpiStatus(d,v,l),p=pc[d.k],c=kStC[st],na=v===null;

    return`<div class="kpi glass kc ${S.kpiSel===d.k?'sel':''}" style="--c:${c}" onclick="S.kpiSel='${d.k}';render()"><div class="ic"><i class="fa-solid ${d.ic}"></i></div><div class="lb">${d.l} <span class="chip ${kStI[st][0]}">${kStI[st][1]}</span></div><div class="v">${na?'—':`<span data-count="${v}" data-dec="${d.dec}">0</span><small>${d.u}</small>`}</div>${tag}${dl}<br><span class="dl n" style="font-size:11px">${lt}</span>${d.note?`<br><span class="dl n" style="font-size:10.5px;opacity:.8">${d.note}</span>`:''}</div>`}).join('');
  const sel=D.find(d=>d.k===S.kpiSel&&cv[d.k]!==null)||D.find(d=>cv[d.k]!==null)||D[0];S.kpiSel=sel.k;
  const lims=D.map(d=>{const u=(DB.settings.kpiLim||{})[d.k]||{},df=kpiDefLim(d.k,a);return`<tr><td><b>${d.l}</b> <small style="color:var(--muted)">${d.u}</small></td><td style="color:var(--muted);font-size:12px">${d.dir==='max'?'Lower is better':'Higher is better'}</td><td><input type="number" step="any" min="0" name="t_${d.k}" value="${u.t!=null?u.t:''}" placeholder="${df?df.t:'none'}"></td><td><input type="number" step="any" min="0" name="c_${d.k}" value="${u.c!=null?u.c:''}" placeholder="${df?df.c:'none'}"></td><td>${u.t!=null?'<span class="chip b">Custom</span>':df?'<span class="chip x">Default</span>':'<span class="chip x">Not set</span>'}</td></tr>`}).join('');
  const kc=Object.values(a.plant).filter(pl=>pl.in);
  const pRows=DB.plants.filter(p=>(!F.plant||p.id===F.plant)).map(p=>{const pa=withF({...F,plant:p.id},()=>agg(r)),pk=kpiCalc(pa);return`<tr><td><b>${esc(p.name)}</b></td>${D.map(d=>{const v=pk[d.k],st=kpiStatus(d,v,kpiLim(d.k,pa));return`<td class="n" style="${v!==null&&st!=='none'?`color:${kStC[st]};font-weight:600`:''}">${v===null?'—':fmt(v,d.dec)}</td>`}).join('')}</tr>`}).join('');
  setTimeout(()=>kpiChart(sel,r),0);
  return pageTitle('Energy Performance Indicators',`${periodTag(r)} • click a card to see its trend • limits are editable below`,`<button class="btn sec" onclick="document.getElementById('kpiLim').scrollIntoView({behavior:'smooth'})"><i class="fa-solid fa-sliders"></i><span class="hide-m">Edit limits</span></button>`)+filterBar()+
  `<div class="kpis">${cards}</div>
  <div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-chart-line"></i>${sel.l} — Trend<span class="r" id="kpiG"></span></h3><div class="cbox s"><canvas id="kpiT"></canvas></div></div>
  <div class="glass card" style="margin-bottom:14px"><h3><i class="fa-solid fa-industry"></i>Plant-wise KPIs<span class="r">coloured by status against the limits</span></h3><div class="tw"><table><thead><tr><th>Plant</th>${D.map(d=>`<th class="n">${d.l}<br><small style="text-transform:none;font-weight:400">${d.u}</small></th>`).join('')}</tr></thead><tbody>${pRows||'<tr><td colspan=11 class="empty">No data</td></tr>'}</tbody></table></div></div>
  <div class="glass card" id="kpiLim"><h3><i class="fa-solid fa-sliders"></i>Custom KPI Limits<span class="r">blank = default (shown in grey)</span></h3><form onsubmit="saveKpiLim(event)"><div class="tw"><table><thead><tr><th>KPI</th><th>Rule</th><th>Target / limit</th><th>Critical limit</th><th>Using</th></tr></thead><tbody>${lims}</tbody></table></div>
   <div class="fact" style="margin-top:14px"><div style="min-width:200px"><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:5px">Available hours per equipment per day (for utilization)</label><input type="number" name="availHrs" min="1" max="24" step="any" value="${+DB.settings.availHrs||24}"></div>
   <button class="btn grn"><i class="fa-solid fa-floppy-disk"></i>Save limits</button><button type="button" class="btn sec" onclick="resetKpiLim()"><i class="fa-solid fa-rotate-left"></i>Reset to defaults</button></div>
   <p style="color:var(--muted);font-size:12px;margin-top:10px">Status: for “lower is better” KPIs, <b>Good</b> ≤ target, <b>Warning</b> up to the critical limit, <b>Critical</b> above it. For “higher is better” KPIs, <b>Good</b> ≥ target, <b>Warning</b> down to the critical limit, <b>Critical</b> below it. kWh/Unit applies when production is measured in Units; kWh/Ton, Litre/Ton and ${cur()}/Ton apply when it is measured in Tonnes (Settings).</p></form></div>`}
function kpiChart(def,r){
  if(typeof Chart==='undefined'){document.querySelectorAll('.cbox').forEach(c=>c.innerHTML='<div class="empty">Chart.js could not load.</div>');return}

  list.forEach(o=>{const ag=agg({f:o.f,to:o.to}),k=kpiCalc(ag);vals.push(k[def.k]===null?null:+k[def.k].toFixed(def.dec+1));lim=kpiLim(def.k,ag)||lim});
  const el=document.getElementById('kpiG');if(el)el.textContent={daily:'daily',weekly:'weekly',monthly:'monthly'}[g]+' • '+def.u;
  const ds=[{label:def.l,data:vals,borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.15)',fill:true,tension:.3,pointRadius:4,borderWidth:2,spanGaps:true}];
  if(lim&&lim.t!=null)ds.push({label:'Target',data:list.map(()=>lim.t),borderColor:'#34d399',borderDash:[6,4],pointRadius:0,borderWidth:2});
  if(lim&&lim.c!=null)ds.push({label:'Critical',data:list.map(()=>lim.c),borderColor:'#f87171',borderDash:[6,4],pointRadius:0,borderWidth:2});
  mk('kpiT',{type:'line',data:{labels:list.map(o=>trLabel(o.b,g)),datasets:ds},options:{interaction:{mode:'index',intersect:false},scales:{x:gridless,y:{beginAtZero:false}}}})}
function saveKpiLim(ev){ev.preventDefault();const f=ev.target.elements,o={},D=KPI_DEFS();
  for(const d of D){const t=numOrBlank(f['t_'+d.k].value),c=numOrBlank(f['c_'+d.k].value);
    if(t.bad||c.bad){toast(`${d.l}: enter a number of 0 or more`,'err');return}
    if(t.blank&&c.blank)continue;if(t.blank){toast(`${d.l}: enter a target as well as a critical limit`,'err');return}
    if(!c.blank){if(d.dir==='max'&&c.v<t.v){toast(`${d.l}: critical limit must be ≥ target (lower is better)`,'err');return}if(d.dir==='min'&&c.v>t.v){toast(`${d.l}: critical limit must be ≤ target (higher is better)`,'err');return}}
    o[d.k]={t:t.v,c:c.blank?null:c.v}}
